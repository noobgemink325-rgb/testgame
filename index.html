<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bot War Arena - Vercel Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #090d16;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 5px;
      color: #ef4444;
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .score-board {
      font-size: 16px;
      margin-bottom: 10px;
      color: #cbd5e1;
    }
    .score-board span {
      color: #22c55e;
      font-weight: bold;
    }
    #game-container {
      position: relative;
      border: 3px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.2);
    }
    canvas {
      background: #0f172a;
      display: block;
      touch-action: none;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #start-btn {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: #ef4444;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }
    #start-btn:active {
      transform: scale(0.95);
    }
    /* Controls HP */
    .mobile-controls {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 45px);
      grid-template-rows: repeat(2, 45px);
      gap: 4px;
    }
    .btn {
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:active {
      background: #334155;
    }
    .btn-shoot {
      width: 90px;
      height: 94px;
      background: #dc2626;
      border-color: #ef4444;
      color: white;
      font-size: 14px;
      border-radius: 12px;
    }
    .btn-shoot:active {
      background: #b91c1c;
    }
  </style>
</head>
<body>

  <h1>WAR ARENA vs BOTS 🔫</h1>
  <div class="score-board">Kill: <span id="kills">0</span> | HP Kamu: <span id="hp" style="color:#ef4444;">100</span></div>

  <div id="game-container">
    <canvas id="canvas" width="340" height="360"></canvas>
    
    <div id="overlay">
      <h2 id="msg-title" style="margin-bottom: 15px; color: #ef4444;">BATTLE START</h2>
      <button id="start-btn" onclick="startGame()">MULAI PERANG 💣</button>
    </div>
  </div>

  <!-- Kontrol Khusus HP -->
  <div class="mobile-controls">
    <div class="d-pad">
      <div></div>
      <button class="btn" onmousedown="startMove('UP')" onmouseup="stopMove()" ontouchstart="startMove('UP')" ontouchend="stopMove()">▲</button>
      <div></div>
      <button class="btn" onmousedown="startMove('LEFT')" onmouseup="stopMove()" ontouchstart="startMove('LEFT')" ontouchend="stopMove()">◄</button>
      <button class="btn" onmousedown="startMove('DOWN')" onmouseup="stopMove()" ontouchstart="startMove('DOWN')" ontouchend="stopMove()">▼</button>
      <button class="btn" onmousedown="startMove('RIGHT')" onmouseup="stopMove()" ontouchstart="startMove('RIGHT')" ontouchend="stopMove()">►</button>
    </div>
    <button class="btn btn-shoot" onclick="playerShoot()">TEMBAK 💥</button>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const killsEl = document.getElementById("kills");
    const hpEl = document.getElementById("hp");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("start-btn");
    const msgTitle = document.getElementById("msg-title");

    let player, bullets, botBullets, bots, kills, isPlaying, gameLoopId, botSpawner;
    let keys = {};
    let lastMoveDir = { x: 0, y: -1 }; // Arah awal nembak ke atas

    // Handle Keyboard
    window.addEventListener("keydown", (e) => {
      keys[e.key] = true;
      if (e.code === "Space" && isPlaying) playerShoot();
    });
    window.addEventListener("keyup", (e) => keys[e.key] = false);

    function startMove(dir) {
      keys['ArrowUp'] = dir === 'UP';
      keys['ArrowDown'] = dir === 'DOWN';
      keys['ArrowLeft'] = dir === 'LEFT';
      keys['ArrowRight'] = dir === 'RIGHT';
    }
    function stopMove() {
      keys['ArrowUp'] = keys['ArrowDown'] = keys['ArrowLeft'] = keys['ArrowRight'] = false;
    }

    function startGame() {
      player = { x: 160, y: 180, radius: 12, hp: 100, speed: 3 };
      bullets = [];
      botBullets = [];
      bots = [];
      kills = 0;
      isPlaying = true;
      
      killsEl.innerText = kills;
      hpEl.innerText = player.hp;
      overlay.style.display = "none";

      if (botSpawner) clearInterval(botSpawner);
      botSpawner = setInterval(spawnBot, 2000); // Spawn bot tiap 2 detik

      if (gameLoopId) cancelAnimationFrame(gameLoopId);
      update();
    }

    function spawnBot() {
      if (!isPlaying) return;
      // Spawn bot dari pinggir layar acak
      let x, y;
      if (Math.random() < 0.5) {
        x = Math.random() < 0.5 ? 0 : canvas.width;
        y = Math.random() * canvas.height;
      } else {
        x = Math.random() * canvas.width;
        y = Math.random() < 0.5 ? 0 : canvas.height;
      }

      bots.push({
        x: x,
        y: y,
        radius: 10,
        speed: 1.2,
        lastShoot: Date.now()
      });
    }

    function playerShoot() {
      if (!isPlaying) return;
      bullets.push({
        x: player.x,
        y: player.y,
        dx: lastMoveDir.x * 6,
        dy: lastMoveDir.y * 6,
        radius: 4
      });
    }

    function update() {
      if (!isPlaying) return;

      // Gerak Player
      let moveX = 0, moveY = 0;
      if (keys['ArrowUp'] || keys['w']) moveY = -1;
      if (keys['ArrowDown'] || keys['s']) moveY = 1;
      if (keys['ArrowLeft'] || keys['a']) moveX = -1;
      if (keys['ArrowRight'] || keys['d']) moveX = 1;

      if (moveX !== 0 || moveY !== 0) {
        lastMoveDir = { x: moveX, y: moveY };
        player.x += moveX * player.speed;
        player.y += moveY * player.speed;
      }

      // Batasi Tembok
      player.x = Math.max(12, Math.min(canvas.width - 12, player.x));
      player.y = Math.max(12, Math.min(canvas.height - 12, player.y));

      // Update Peluru Player
      bullets.forEach((b, index) => {
        b.x += b.dx;
        b.y += b.dy;
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          bullets.splice(index, 1);
        }
      });

      // Update Bot & Logika Bot Nembak
      bots.forEach((bot, bIndex) => {
        // Bot jalan mendekati Player
        let angle = Math.atan2(player.y - bot.y, player.x - bot.x);
        bot.x += Math.cos(angle) * bot.speed;
        bot.y += Math.sin(angle) * bot.speed;

        // Bot Nembak Otomatis tiap 1.5 detik
        if (Date.now() - bot.lastShoot > 1500) {
          botBullets.push({
            x: bot.x,
            y: bot.y,
            dx: Math.cos(angle) * 4,
            dy: Math.sin(angle) * 4,
            radius: 3
          });
          bot.lastShoot = Date.now();
        }

        // Cek Peluru Player kena Bot
        bullets.forEach((b, pIndex) => {
          let dist = Math.hypot(b.x - bot.x, b.y - bot.y);
          if (dist < b.radius + bot.radius) {
            bots.splice(bIndex, 1);
            bullets.splice(pIndex, 1);
            kills++;
            killsEl.innerText = kills;
          }
        });
      });

      // Update Peluru Bot
      botBullets.forEach((bb, index) => {
        bb.x += bb.dx;
        bb.y += bb.dy;

        // Cek Peluru Bot kena Player
        let dist = Math.hypot(bb.x - player.x, bb.y - player.y);
        if (dist < bb.radius + player.radius) {
          player.hp -= 10;
          hpEl.innerText = player.hp;
          botBullets.splice(index, 1);

          if (player.hp <= 0) {
            gameOver();
          }
        }

        if (bb.x < 0 || bb.x > canvas.width || bb.y < 0 || bb.y > canvas.height) {
          botBullets.splice(index, 1);
        }
      });

      draw();
      gameLoopId = requestAnimationFrame(update);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Gambar Player (Biru)
      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // Gambar Moncong Senjata
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(player.x, player.y);
      ctx.lineTo(player.x + lastMoveDir.x * 16, player.y + lastMoveDir.y * 16);
      ctx.stroke();

      // Gambar Peluru Player (Kuning)
      ctx.fillStyle = "#facc15";
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Gambar Bot (Merah)
      ctx.fillStyle = "#ef4444";
      bots.forEach(bot => {
        ctx.beginPath();
        ctx.arc(bot.x, bot.y, bot.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Gambar Peluru Bot (Orange)
      ctx.fillStyle = "#fb923c";
      botBullets.forEach(bb => {
        ctx.beginPath();
        ctx.arc(bb.x, bb.y, bb.radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function gameOver() {
      isPlaying = false;
      clearInterval(botSpawner);
      msgTitle.innerText = "KAMU GUGUR!";
      startBtn.innerText = "MAIN LAGI 🔄";
      overlay.style.display = "flex";
    }
  </script>
</body>
</html>
