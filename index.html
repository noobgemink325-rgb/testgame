<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Bot War Arena 3D - Fixed Co-Op HP & Solo Mode</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #090d16;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 10px 0;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 2px;
      color: #ef4444;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .score-board {
      font-size: 13px;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    #game-container {
      position: relative;
      width: 340px;
      height: 280px;
      border: 3px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.2);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 15px;
    }
    .mode-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      width: 85%;
    }
    .btn-tab {
      flex: 1;
      padding: 6px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #94a3b8;
      cursor: pointer;
    }
    .btn-tab.active {
      background: #22c55e;
      color: #fff;
      border-color: #4ade80;
    }
    input[type="text"] {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      font-size: 14px;
      text-align: center;
      margin-bottom: 8px;
      width: 85%;
      outline: none;
    }
    .room-group {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      width: 85%;
    }
    .btn-room {
      flex: 1;
      padding: 8px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 6px;
      border: 1px solid #38bdf8;
      background: #0284c7;
      color: #fff;
      cursor: pointer;
    }
    .btn-room-secondary {
      background: #334155;
      border-color: #475569;
      color: #cbd5e1;
    }
    #start-btn {
      padding: 10px 24px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      background: #ef4444;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }
    #start-btn:active { transform: scale(0.95); }

    .controls-wrapper {
      width: 340px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding: 0 10px;
    }
    #joystick-container {
      width: 90px;
      height: 90px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      position: relative;
      touch-action: none;
    }
    #joystick-stick {
      width: 36px;
      height: 36px;
      background: #38bdf8;
      border-radius: 50%;
      position: absolute;
      top: 25px;
      left: 25px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
      pointer-events: none;
    }
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .btn-shoot {
      width: 100px;
      height: 42px;
      background: #dc2626;
      border: 2px solid #ef4444;
      color: white;
      font-weight: bold;
      font-size: 13px;
      border-radius: 8px;
      touch-action: manipulation;
    }
    .btn-weapon {
      background: #0284c7;
      color: #fff;
      border: 1px solid #38bdf8;
      padding: 5px;
      font-size: 11px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
    }
    .toggle-auto {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 4px;
      font-size: 10px;
      border-radius: 6px;
      text-align: center;
    }

    .leaderboard-box {
      width: 340px;
      margin-top: 6px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 12px;
    }
    .leaderboard-title {
      font-size: 11px;
      color: #facc15;
      font-weight: bold;
      text-align: center;
      margin-bottom: 2px;
      text-transform: uppercase;
    }
    ol { padding-left: 18px; font-size: 11px; color: #cbd5e1; }
    li { margin-bottom: 1px; }
    .no-data { color: #64748b; font-size: 10px; text-align: center; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <h1>WAR ARENA 3D 💣</h1>
  <div class="score-board">
    Kill Tim: <span id="kills" style="color:#22c55e; font-weight:bold;">0</span> | 
    HP Kamu: <span id="hp" style="color:#ef4444; font-weight:bold;">100</span> | 
    Room: <span id="room-display" style="color:#facc15; font-weight:bold;">-</span>
  </div>

  <div id="game-container">
    <div id="overlay">
      <!-- TAB MODE SELECTOR -->
      <div class="mode-tabs">
        <button id="tab-solo-btn" class="btn-tab" onclick="switchGameMode('solo')">SOLO PLAYER</button>
        <button id="tab-coop-btn" class="btn-tab active" onclick="switchGameMode('coop')">CO-OP MULTIPLAYER</button>
      </div>

      <h2 id="msg-title" style="margin-bottom: 6px; color: #ef4444;">CO-OP MULTIPLAYER</h2>
      <input type="text" id="player-name" placeholder="Masukkan Nickname..." maxlength="12">
      
      <!-- CONTROLS CO-OP -->
      <div id="coop-controls" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="room-group">
          <button class="btn-room" onclick="createRoom()">BUAT ROOM ➕</button>
          <button class="btn-room btn-room-secondary" onclick="joinRoomPrompt()">JOIN ROOM 🔗</button>
        </div>
        <input type="text" id="room-code-input" placeholder="Kode Room (4 Digit)" maxlength="4" style="display:none;">
      </div>

      <button id="start-btn" onclick="startGame()" style="display:none;">MULAI CO-OP 🚀</button>
      <p id="room-info" style="font-size:11px; color:#94a3b8; margin-top:4px;"></p>
    </div>
  </div>

  <div class="controls-wrapper">
    <div id="joystick-container">
      <div id="joystick-stick"></div>
    </div>

    <div class="action-group">
      <button class="btn-weapon" id="weapon-btn" onclick="toggleWeapon()">Senjata: PISTOL 🔫</button>
      <button class="btn-shoot" id="shoot-btn">TEMBAK 💥</button>
      <button id="auto-btn" class="toggle-auto" onclick="toggleAutoShoot()">Auto Shoot: OFF</button>
    </div>
  </div>

  <!-- FIX BUG TAG HTML LEADERBOARD -->
  <div class="leaderboard-box">
    <div id="lb-title-text" class="leaderboard-title">🏆 TOP TIM CO-OP GLOBAL</div>
    <ol id="leaderboard-list">
      <p class="no-data">Memuat leaderboard...</p>
    </ol>
  </div>

  <script>
    // --- INTEGRASI FIREBASE MULTIPLAYER ---
    const firebaseConfig = {
      apiKey: "AIzaSyBOo74lEYtQGFC5_1NeDLPi0DuG2QhAK3g",
      authDomain: "bot-war-arena.firebaseapp.com",
      databaseURL: "https://bot-war-arena-default-rtdb.firebaseio.com",
      projectId: "bot-war-arena",
      storageBucket: "bot-war-arena.firebasestorage.app",
      messagingSenderId: "622360630602",
      appId: "1:622360630602:web:35fd02550b36605be55db3",
      measurementId: "G-X0T2H996NE"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let gameMode = 'coop'; // 'solo' atau 'coop'
    let roomId = null;
    let playerRole = null;
    let roomRef = null;
    let p1Name = "P1", p2Name = "P2";
    let lastHitTime = 0;

    // --- SWITCH MODE SOLO / CO-OP ---
    function switchGameMode(mode) {
      gameMode = mode;
      const tabSolo = document.getElementById("tab-solo-btn");
      const tabCoop = document.getElementById("tab-coop-btn");
      const coopControls = document.getElementById("coop-controls");
      const msgTitle = document.getElementById("msg-title");
      const startBtn = document.getElementById("start-btn");
      const roomInfo = document.getElementById("room-info");
      const lbTitle = document.getElementById("lb-title-text");

      if (mode === 'solo') {
        tabSolo.classList.add("active");
        tabCoop.classList.remove("active");
        coopControls.style.display = "none";
        msgTitle.innerText = "SOLO PLAYER";
        msgTitle.style.color = "#22c55e";
        startBtn.innerText = "MAIN SOLO 🚀";
        startBtn.style.display = "block";
        roomInfo.innerText = "Mode Solo: Bermain sendiri lawan Bot!";
        lbTitle.innerText = "🏆 TOP SOLO GLOBAL";
        loadSoloLeaderboard();
      } else {
        tabCoop.classList.add("active");
        tabSolo.classList.remove("active");
        coopControls.style.display = "flex";
        msgTitle.innerText = "CO-OP MULTIPLAYER";
        msgTitle.style.color = "#ef4444";
        startBtn.innerText = "MULAI CO-OP 🚀";
        startBtn.style.display = roomId ? "block" : "none";
        roomInfo.innerText = "";
        lbTitle.innerText = "🏆 TOP TIM CO-OP GLOBAL";
        loadCoopLeaderboard();
      }
    }

    function loadCoopLeaderboard() {
      db.ref('leaderboard_coop').orderByChild('kills').limitToLast(5).on('value', (snapshot) => {
        if (gameMode !== 'coop') return;
        const list = document.getElementById("leaderboard-list");
        list.innerHTML = "";
        let scores = [];
        snapshot.forEach((child) => scores.push(child.val()));
        scores.sort((a, b) => b.kills - a.kills);

        if (scores.length === 0) {
          list.innerHTML = `<p class="no-data">Belum ada rekor tim. Jadi yang pertama!</p>`;
          return;
        }

        scores.forEach((item) => {
          const li = document.createElement("li");
          li.innerHTML = `<b>${item.team}</b>: <span style="color:#22c55e">${item.kills} Kill</span>`;
          list.appendChild(li);
        });
      });
    }

    function loadSoloLeaderboard() {
      db.ref('leaderboard_solo').orderByChild('kills').limitToLast(5).on('value', (snapshot) => {
        if (gameMode !== 'solo') return;
        const list = document.getElementById("leaderboard-list");
        list.innerHTML = "";
        let scores = [];
        snapshot.forEach((child) => scores.push(child.val()));
        scores.sort((a, b) => b.kills - a.kills);

        if (scores.length === 0) {
          list.innerHTML = `<p class="no-data">Belum ada rekor Solo. Raih Kill terbanyak!</p>`;
          return;
        }

        scores.forEach((item) => {
          const li = document.createElement("li");
          li.innerHTML = `<b>${item.name}</b>: <span style="color:#22c55e">${item.kills} Kill</span>`;
          list.appendChild(li);
        });
      });
    }

    function saveCoopScore(teamName, killCount) {
      if (killCount === 0) return;
      db.ref('leaderboard_coop').push({
        team: teamName,
        kills: killCount,
        timestamp: Date.now()
      });
    }

    function saveSoloScore(playerName, killCount) {
      if (killCount === 0) return;
      db.ref('leaderboard_solo').push({
        name: playerName,
        kills: killCount,
        timestamp: Date.now()
      });
    }

    function createRoom() {
      roomId = Math.floor(1000 + Math.random() * 9000).toString();
      playerRole = 'p1';
      p1Name = document.getElementById('player-name').value.trim() || 'P1';
      roomRef = db.ref(`rooms/${roomId}`);

      roomRef.set({
        status: 'waiting',
        p1: { name: p1Name, x: -2, z: 0, hp: 100 },
        p2: { name: 'Menunggu...', x: 2, z: 0, hp: 100 },
        kills: 0
      });

      document.getElementById('room-display').innerText = roomId;
      document.getElementById('room-info').innerText = `Kode Room: ${roomId} (Bagikan ke teman!)`;
      document.getElementById('start-btn').style.display = 'block';

      listenToRoom();
    }

    function joinRoomPrompt() {
      const codeInput = document.getElementById('room-code-input');
      if (codeInput.style.display === 'none') {
        codeInput.style.display = 'block';
        return;
      }

      roomId = codeInput.value.trim();
      if (!roomId) return alert("Masukkan kode room!");

      playerRole = 'p2';
      p2Name = document.getElementById('player-name').value.trim() || 'P2';
      roomRef = db.ref(`rooms/${roomId}`);

      roomRef.get().then((snapshot) => {
        if (snapshot.exists()) {
          p1Name = snapshot.val().p1.name;
          roomRef.child('p2').set({
            name: p2Name,
            x: 2,
            z: 0,
            hp: 100
          });
          document.getElementById('room-display').innerText = roomId;
          listenToRoom();
        } else {
          alert("Room tidak ditemukan!");
        }
      });
    }

    function listenToRoom() {
      if (!roomRef) return;
      roomRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data || gameMode === 'solo') return;

        if (data.p1) p1Name = data.p1.name;
        if (data.p2) p2Name = data.p2.name;

        const otherRole = playerRole === 'p1' ? 'p2' : 'p1';
        if (data[otherRole] && otherPlayerMesh) {
          otherPlayerMesh.position.x = data[otherRole].x;
          otherPlayerMesh.position.z = data[otherRole].z;
        }

        if (data.status === 'playing' && !isPlaying) {
          startGameLocal();
        } else if (data.status === 'gameover' && isPlaying) {
          triggerLocalGameOver();
        }

        if (data.kills !== undefined) {
          kills = data.kills;
          killsEl.innerText = kills;
        }
      });

      roomRef.child('bots').on('child_added', (snapshot) => {
        if (gameMode === 'coop' && playerRole === 'p2') {
          const bData = snapshot.val();
          spawnRemoteBot(snapshot.key, bData.x, bData.z);
        }
      });

      roomRef.child('bots').on('child_removed', (snapshot) => {
        if (gameMode === 'coop') {
          const key = snapshot.key;
          const bIndex = bots.findIndex(b => b.key === key);
          if (bIndex !== -1) {
            scene.remove(bots[bIndex].mesh);
            bots.splice(bIndex, 1);
          }
        }
      });

      roomRef.child('bullets').on('child_added', (snapshot) => {
        if (gameMode === 'coop') {
          const b = snapshot.val();
          if (b.owner !== playerRole) {
            spawnRemoteBullet(b);
          }
        }
      });
    }

    // --- GAME ENGINE 3D ---
    const container = document.getElementById("game-container");
    const killsEl = document.getElementById("kills");
    const hpEl = document.getElementById("hp");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("start-btn");
    const msgTitle = document.getElementById("msg-title");
    const autoBtn = document.getElementById("auto-btn");
    const weaponBtn = document.getElementById("weapon-btn");
    const shootBtn = document.getElementById("shoot-btn");

    let scene, camera, renderer;
    let playerMesh, otherPlayerMesh, playerHP = 100, kills = 0, isPlaying = false;
    let bullets = [], botBullets = [], bots = [];
    let keys = {}, lastMoveDir = { x: 0, z: -1 }, joystickDir = { x: 0, y: 0 };
    let botSpawner, autoShootInterval, autoShoot = false;
    let currentWeapon = "PISTOL";
    let lastShootTime = 0;
    const ARENA_SIZE = 26;

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);

      camera = new THREE.PerspectiveCamera(45, 340 / 280, 0.1, 1000);
      camera.position.set(0, 32, 22);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(340, 280);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      const gridHelper = new THREE.GridHelper(ARENA_SIZE, 16, 0xef4444, 0x334155);
      gridHelper.position.y = -0.5;
      scene.add(gridHelper);

      playerMesh = createPlayerMesh(0x38bdf8);
      scene.add(playerMesh);

      otherPlayerMesh = createPlayerMesh(0x22c55e);
      scene.add(otherPlayerMesh);

      animate();
    }

    function createPlayerMesh(colorHex) {
      const pGroup = new THREE.Group();
      const bodyGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
      const bodyMat = new THREE.MeshPhongMaterial({ color: colorHex });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.castShadow = true;
      pGroup.add(body);

      const gunGeo = new THREE.BoxGeometry(0.3, 0.3, 0.8);
      const gunMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
      const gun = new THREE.Mesh(gunGeo, gunMat);
      gun.position.set(0, 0, -0.7);
      pGroup.add(gun);

      return pGroup;
    }

    // MULTI-TOUCH JOYSTICK LOGIC
    const joyContainer = document.getElementById("joystick-container");
    const joyStick = document.getElementById("joystick-stick");
    const maxRadius = 28;
    let joystickTouchId = null;

    function processJoyMove(clientX, clientY) {
      const rect = joyContainer.getBoundingClientRect();
      let dx = clientX - (rect.left + rect.width / 2);
      let dy = clientY - (rect.top + rect.height / 2);
      let distance = Math.hypot(dx, dy);

      if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
      }

      joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
      joystickDir.x = dx / maxRadius;
      joystickDir.y = dy / maxRadius;

      if (Math.abs(joystickDir.x) > 0.05 || Math.abs(joystickDir.y) > 0.05) {
        lastMoveDir = { x: joystickDir.x, z: joystickDir.y };
      }
    }

    function resetJoy() {
      joystickTouchId = null;
      joyStick.style.transform = "translate(0px, 0px)";
      joystickDir = { x: 0, y: 0 };
    }

    window.addEventListener("touchstart", (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        let touch = e.changedTouches[i];
        const rect = joyContainer.getBoundingClientRect();
        if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
            touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
          if (joystickTouchId === null) {
            joystickTouchId = touch.identifier;
            processJoyMove(touch.clientX, touch.clientY);
          }
        }
      }
    }, { passive: false });

    window.addEventListener("touchmove", (e) => {
      if (joystickTouchId !== null) {
        for (let i = 0; i < e.changedTouches.length; i++) {
          let touch = e.changedTouches[i];
          if (touch.identifier === joystickTouchId) processJoyMove(touch.clientX, touch.clientY);
        }
      }
    }, { passive: false });

    window.addEventListener("touchend", (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joystickTouchId) resetJoy();
      }
    });

    shootBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      if (isPlaying) playerShoot();
    });
    shootBtn.addEventListener("mousedown", () => {
      if (isPlaying) playerShoot();
    });

    window.addEventListener("keydown", (e) => {
      keys[e.key] = true;
      if (e.code === "Space" && isPlaying) playerShoot();
    });
    window.addEventListener("keyup", (e) => keys[e.key] = false);

    function toggleWeapon() {
      if (currentWeapon === "PISTOL") {
        currentWeapon = "BAZOKA";
        weaponBtn.innerText = "Senjata: BAZOKA 🚀";
        weaponBtn.style.background = "#d97706";
        weaponBtn.style.borderColor = "#f59e0b";
      } else {
        currentWeapon = "PISTOL";
        weaponBtn.innerText = "Senjata: PISTOL 🔫";
        weaponBtn.style.background = "#0284c7";
        weaponBtn.style.borderColor = "#38bdf8";
      }
    }

    function toggleAutoShoot() {
      autoShoot = !autoShoot;
      autoBtn.innerText = autoShoot ? "Auto Shoot: ON 🔥" : "Auto Shoot: OFF";
      autoBtn.style.background = autoShoot ? "#16a34a" : "#334155";

      if (autoShoot) {
        autoShootInterval = setInterval(() => { if (isPlaying) playerShoot(); }, 250);
      } else {
        clearInterval(autoShootInterval);
      }
    }

    function startGame() {
      if (gameMode === 'solo') {
        playerRole = 'p1';
        document.getElementById('room-display').innerText = 'SOLO';
        startGameLocal();
      } else if (playerRole === 'p1' && roomRef) {
        roomRef.update({ status: 'playing', kills: 0, bots: null, bullets: null });
      }
    }

    function startGameLocal() {
      playerHP = 100;
      kills = 0;
      isPlaying = true;

      bullets.forEach(b => scene.remove(b.mesh));
      botBullets.forEach(bb => scene.remove(bb.mesh));
      bots.forEach(bot => scene.remove(bot.mesh));
      bullets = []; botBullets = []; bots = [];

      playerMesh.position.set(playerRole === 'p1' ? -2 : 2, 0.6, 0);
      
      if (gameMode === 'solo') {
        otherPlayerMesh.visible = false;
      } else {
        otherPlayerMesh.visible = true;
      }

      killsEl.innerText = kills;
      hpEl.innerText = playerHP;
      overlay.style.display = "none";

      if (botSpawner) clearInterval(botSpawner);
      if (gameMode === 'solo' || playerRole === 'p1') {
        botSpawner = setInterval(spawnBotHost, 1500);
      }
    }

    function spawnBotHost() {
      if (!isPlaying) return;
      let side = Math.random() < 0.5 ? -1 : 1;
      let x = (Math.random() - 0.5) * ARENA_SIZE;
      let z = side * (ARENA_SIZE / 2);

      if (gameMode === 'solo') {
        spawnRemoteBot(Date.now().toString(), x, z);
      } else if (playerRole === 'p1' && roomRef) {
        const botRef = roomRef.child('bots').push();
        botRef.set({ x: x, z: z });
        spawnRemoteBot(botRef.key, x, z);
      }
    }

    function spawnRemoteBot(key, x, z) {
      const botGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
      const botMat = new THREE.MeshPhongMaterial({ color: 0xef4444 });
      const mesh = new THREE.Mesh(botGeo, botMat);
      mesh.position.set(x, 0.6, z);
      scene.add(mesh);

      bots.push({ key: key, mesh: mesh, speed: 0.08 });
    }

    function playerShoot() {
      if (!isPlaying) return;

      const now = Date.now();
      const cooldown = (currentWeapon === "BAZOKA") ? 1000 : 250;
      if (now - lastShootTime < cooldown) return;
      lastShootTime = now;

      let mag = Math.hypot(lastMoveDir.x, lastMoveDir.z) || 1;
      let dx = (lastMoveDir.x / mag) * (currentWeapon === "BAZOKA" ? 0.22 : 0.45);
      let dz = (lastMoveDir.z / mag) * (currentWeapon === "BAZOKA" ? 0.22 : 0.45);

      const bGeo = new THREE.SphereGeometry(currentWeapon === "BAZOKA" ? 0.5 : 0.25, 8, 8);
      const bMat = new THREE.MeshBasicMaterial({ color: currentWeapon === "BAZOKA" ? 0xf97316 : 0xfacc15 });
      const mesh = new THREE.Mesh(bGeo, bMat);
      mesh.position.set(playerMesh.position.x, 0.6, playerMesh.position.z);
      scene.add(mesh);

      bullets.push({ mesh: mesh, dx: dx, dz: dz, type: currentWeapon });

      if (gameMode === 'coop' && roomRef) {
        roomRef.child('bullets').push({
          x: playerMesh.position.x,
          z: playerMesh.position.z,
          dx: dx,
          dz: dz,
          type: currentWeapon,
          owner: playerRole
        });
      }
    }

    function spawnRemoteBullet(b) {
      const bGeo = new THREE.SphereGeometry(b.type === "BAZOKA" ? 0.5 : 0.25, 8, 8);
      const bMat = new THREE.MeshBasicMaterial({ color: 0x22c55e });
      const mesh = new THREE.Mesh(bGeo, bMat);
      mesh.position.set(b.x, 0.6, b.z);
      scene.add(mesh);

      bullets.push({ mesh: mesh, dx: b.dx, dz: b.dz, type: b.type });
    }

    function updateGameLogic() {
      if (!isPlaying) return;

      let moveX = joystickDir.x;
      let moveZ = joystickDir.y;

      if (keys['ArrowUp'] || keys['w']) moveZ = -1;
      if (keys['ArrowDown'] || keys['s']) moveZ = 1;
      if (keys['ArrowLeft'] || keys['a']) moveX = -1;
      if (keys['ArrowRight'] || keys['d']) moveX = 1;

      if (moveX !== 0 || moveZ !== 0) {
        playerMesh.position.x += moveX * 0.12;
        playerMesh.position.z += moveZ * 0.12;
        lastMoveDir = { x: moveX, z: moveZ };

        let angle = Math.atan2(moveX, moveZ);
        playerMesh.rotation.y = angle + Math.PI;

        if (gameMode === 'coop' && roomRef) {
          roomRef.child(playerRole).update({
            x: playerMesh.position.x,
            z: playerMesh.position.z
          });
        }
      }

      const limit = (ARENA_SIZE / 2) - 1;
      playerMesh.position.x = Math.max(-limit, Math.min(limit, playerMesh.position.x));
      playerMesh.position.z = Math.max(-limit, Math.min(limit, playerMesh.position.z));

      // Peluru & Deteksi Hit Musuh
      bullets.forEach((b, index) => {
        b.mesh.position.x += b.dx;
        b.mesh.position.z += b.dz;

        bots.forEach((bot, bIdx) => {
          let dist = b.mesh.position.distanceTo(bot.mesh.position);
          if (dist < 0.9) {
            if (gameMode === 'solo') {
              scene.remove(bot.mesh);
              bots.splice(bIdx, 1);
            } else if (playerRole === 'p1' && roomRef) {
              roomRef.child(`bots/${bot.key}`).remove();
            }
            scene.remove(b.mesh);
            bullets.splice(index, 1);
            kills++;
            killsEl.innerText = kills;
            if (gameMode === 'coop' && roomRef) roomRef.update({ kills: kills });
          }
        });

        if (Math.abs(b.mesh.position.x) > limit || Math.abs(b.mesh.position.z) > limit) {
          scene.remove(b.mesh);
          bullets.splice(index, 1);
        }
      });

      // Pergerakan Musuh & Sistem Kena Hit
      const now = Date.now();
      bots.forEach((bot) => {
        let distP1 = bot.mesh.position.distanceTo(playerMesh.position);
        let distP2 = (gameMode === 'coop') ? bot.mesh.position.distanceTo(otherPlayerMesh.position) : 999;
        let target = distP1 < distP2 ? playerMesh.position : otherPlayerMesh.position;

        let dx = target.x - bot.mesh.position.x;
        let dz = target.z - bot.mesh.position.z;
        let angle = Math.atan2(dx, dz);

        bot.mesh.position.x += Math.sin(angle) * bot.speed;
        bot.mesh.position.z += Math.cos(angle) * bot.speed;
        bot.mesh.rotation.y = angle;

        // Deteksi tabrakan bot ke player (Darah Berkurang)
        if (distP1 < 0.8 && now - lastHitTime > 800) {
          lastHitTime = now;
          playerHP -= 20;
          if (playerHP < 0) playerHP = 0;
          hpEl.innerText = playerHP;

          if (playerHP <= 0 && isPlaying) {
            if (gameMode === 'solo') {
              triggerLocalGameOver();
            } else {
              triggerGlobalGameOver();
            }
          }
        }
      });
    }

    function triggerGlobalGameOver() {
      if (roomRef) {
        roomRef.update({ status: 'gameover' });
      }
    }

    function triggerLocalGameOver() {
      isPlaying = false;
      clearInterval(botSpawner);

      const playerName = document.getElementById('player-name').value.trim() || 'Player';
      if (gameMode === 'solo') {
        saveSoloScore(playerName, kills);
        msgTitle.innerText = "KAMU GUGUR!";
      } else {
        const teamName = `${p1Name} & ${p2Name}`;
        if (playerRole === 'p1') saveCoopScore(teamName, kills);
        msgTitle.innerText = "TIM KAMU GUGUR!";
      }

      startBtn.innerText = "MAIN LAGI 🔄";
      overlay.style.display = "flex";
    }

    function animate() {
      requestAnimationFrame(animate);
      updateGameLogic();
      renderer.render(scene, camera);
    }

    init3D();
    loadCoopLeaderboard();
  </script>
</body>
</html>
