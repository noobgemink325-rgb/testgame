<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Defender - Vercel Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #090d16;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 8px;
      font-size: 22px;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #1e293b;
    }
    canvas {
      background: #030712;
      display: block;
    }
    .controls-hint {
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Space Defender 🚀</h1>
  <div id="game-container">
    <canvas id="gameCanvas" width="360" height="520"></canvas>
  </div>
  <p class="controls-hint">Pake <b>Panah Kiri/Kanan & SPASI</b>, atau <b>Geser/Sentuh Screen</b> di HP</p>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let score = 0;
    let gameOver = false;
    let gameStarted = false;

    // Player (Pesawat)
    const player = {
      x: canvas.width / 2 - 15,
      y: canvas.height - 50,
      width: 30,
      height: 30,
      speed: 5,
      dx: 0
    };

    // Array Peluru & Meteor
    let bullets = [];
    let meteors = [];

    // Bintang background
    let stars = [];
    for (let i = 0; i < 50; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speed: Math.random() * 1 + 0.5
      });
    }

    // Keyboard Controls
    document.addEventListener("keydown", (e) => {
      if (!gameStarted || gameOver) {
        if (e.code === "Space" || e.code === "Enter") resetGame();
      }
      if (e.code === "ArrowLeft" || e.code === "KeyA") player.dx = -player.speed;
      if (e.code === "ArrowRight" || e.code === "KeyD") player.dx = player.speed;
      if (e.code === "Space" && gameStarted && !gameOver) shootBullet();
    });

    document.addEventListener("keyup", (e) => {
      if (e.code === "ArrowLeft" || e.code === "ArrowRight" || e.code === "KeyA" || e.code === "KeyD") {
        player.dx = 0;
      }
    });

    // Mobile / Touch Controls
    let isTouching = false;
    canvas.addEventListener("touchstart", (e) => {
      if (!gameStarted || gameOver) {
        resetGame();
        return;
      }
      isTouching = true;
      movePlayerTouch(e);
      shootBullet();
    });

    canvas.addEventListener("touchmove", (e) => {
      if (isTouching && gameStarted && !gameOver) {
        movePlayerTouch(e);
      }
    });

    canvas.addEventListener("touchend", () => {
      isTouching = false;
    });

    function movePlayerTouch(e) {
      const rect = canvas.getBoundingClientRect();
      const touchX = e.touches[0].clientX - rect.left;
      player.x = touchX - player.width / 2;
    }

    // Tembak Peluru
    function shootBullet() {
      bullets.push({
        x: player.x + player.width / 2 - 2,
        y: player.y,
        width: 4,
        height: 10,
        speed: 7
      });
    }

    // Spawn Meteor
    let meteorTimer = 0;
    function spawnMeteor() {
      meteorTimer++;
      if (meteorTimer % 40 === 0) {
        const size = Math.random() * 20 + 15;
        meteors.push({
          x: Math.random() * (canvas.width - size),
          y: -size,
          size: size,
          speed: Math.random() * 2 + 2
        });
      }
    }

    function resetGame() {
      score = 0;
      bullets = [];
      meteors = [];
      player.x = canvas.width / 2 - 15;
      gameOver = false;
      gameStarted = true;
    }

    // Loop Utama Game
    function update() {
      if (!gameStarted || gameOver) return;

      // Move Player
      player.x += player.dx;
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

      // Move Bullets
      bullets.forEach((b, index) => {
        b.y -= b.speed;
        if (b.y < 0) bullets.splice(index, 1);
      });

      // Move Meteors & Collision
      spawnMeteor();
      meteors.forEach((m, mIndex) => {
        m.y += m.speed;

        // Cek kena pesawat
        if (
          player.x < m.x + m.size &&
          player.x + player.width > m.x &&
          player.y < m.y + m.size &&
          player.y + player.height > m.y
        ) {
          gameOver = true;
        }

        // Cek kena peluru
        bullets.forEach((b, bIndex) => {
          if (
            b.x < m.x + m.size &&
            b.x + b.width > m.x &&
            b.y < m.y + m.size &&
            b.y + b.height > m.y
          ) {
            meteors.splice(mIndex, 1);
            bullets.splice(bIndex, 1);
            score += 10;
          }
        });

        if (m.y > canvas.height) meteors.splice(mIndex, 1);
      });
    }

    function draw() {
      // Clear screen
      ctx.fillStyle = "#030712";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Stars
      ctx.fillStyle = "#ffffff";
      stars.forEach((s) => {
        ctx.fillRect(s.x, s.y, s.size, s.size);
        s.y += s.speed;
        if (s.y > canvas.height) s.y = 0;
      });

      if (!gameStarted) {
        ctx.fillStyle = "#38bdf8";
        ctx.font = "20px Arial";
        ctx.textAlign = "center";
        ctx.fillText("SPACE DEFENDER", canvas.width / 2, 220);
        ctx.fillStyle = "#fff";
        ctx.font = "14px Arial";
        ctx.fillText("Tekan SPASI / Sentuh Screen", canvas.width / 2, 260);
        return;
      }

      // Draw Player (Segitiga Pesawat Keren)
      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.moveTo(player.x + player.width / 2, player.y);
      ctx.lineTo(player.x, player.y + player.height);
      ctx.lineTo(player.x + player.width, player.y + player.height);
      ctx.closePath();
      ctx.fill();

      // Draw Bullets (Laser)
      ctx.fillStyle = "#f43f5e";
      bullets.forEach((b) => {
        ctx.fillRect(b.x, b.y, b.width, b.height);
      });

      // Draw Meteors
      ctx.fillStyle = "#f59e0b";
      meteors.forEach((m) => {
        ctx.beginPath();
        ctx.arc(m.x + m.size/2, m.y + m.size/2, m.size/2, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw Score
      ctx.fillStyle = "#fff";
      ctx.font = "16px Arial";
      ctx.textAlign = "left";
      ctx.fillText("Score: " + score, 15, 25);

      // Draw Game Over Screen
      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ef4444";
        ctx.font = "26px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, 220);

        ctx.fillStyle = "#fff";
        ctx.font = "16px Arial";
        ctx.fillText("Score Akhir: " + score, canvas.width / 2, 255);
        ctx.font = "14px Arial";
        ctx.fillText("Main Lagi? Sentuh / Tekan SPASI", canvas.width / 2, 295);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
