<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Bot War Arena 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #090d16;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 10px 0;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 2px;
      color: #ef4444;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .score-board {
      font-size: 14px;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    #game-container {
      position: relative;
      width: 340px;
      height: 280px;
      border: 3px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.2);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 20px;
    }
    input[type="text"] {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      font-size: 15px;
      text-align: center;
      margin-bottom: 12px;
      width: 80%;
      outline: none;
    }
    #start-btn {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: #ef4444;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }
    #start-btn:active { transform: scale(0.95); }

    .controls-wrapper {
      width: 340px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding: 0 10px;
    }
    #joystick-container {
      width: 90px;
      height: 90px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      position: relative;
      touch-action: none;
    }
    #joystick-stick {
      width: 36px;
      height: 36px;
      background: #38bdf8;
      border-radius: 50%;
      position: absolute;
      top: 25px;
      left: 25px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
      pointer-events: none;
    }
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .btn-shoot {
      width: 90px;
      height: 48px;
      background: #dc2626;
      border: 2px solid #ef4444;
      color: white;
      font-weight: bold;
      font-size: 14px;
      border-radius: 10px;
      touch-action: manipulation;
    }
    .toggle-auto {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 5px;
      font-size: 11px;
      border-radius: 6px;
      text-align: center;
    }

    .leaderboard-box {
      width: 340px;
      margin-top: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px 12px;
    }
    .leaderboard-title {
      font-size: 13px;
      color: #facc15;
      font-weight: bold;
      text-align: center;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    ol { padding-left: 20px; font-size: 12px; color: #cbd5e1; }
    li { margin-bottom: 2px; }
    .no-data { color: #64748b; font-size: 11px; text-align: center; }
  </style>

  <!-- Library Three.js 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Library Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <h1>WAR ARENA 3D 💣</h1>
  <div class="score-board">Kill: <span id="kills" style="color:#22c55e; font-weight:bold;">0</span> | HP: <span id="hp" style="color:#ef4444; font-weight:bold;">100</span></div>

  <div id="game-container">
    <div id="overlay">
      <h2 id="msg-title" style="margin-bottom: 10px; color: #ef4444;">BOT WAR ARENA 3D</h2>
      <input type="text" id="player-name" placeholder="Masukkan Nickname..." maxlength="12">
      <button id="start-btn" onclick="startGame()">MULAI PERANG 💣</button>
    </div>
  </div>

  <div class="controls-wrapper">
    <div id="joystick-container">
      <div id="joystick-stick"></div>
    </div>

    <div class="action-group">
      <button class="btn-shoot" id="shoot-btn">TEMBAK 💥</button>
      <button id="auto-btn" class="toggle-auto" onclick="toggleAutoShoot()">Auto Shoot: OFF</button>
    </div>
  </div>

  <div class="leaderboard-box">
    <div class="leaderboard-title">🏆 LEADERBOARD TOP KILL</div>
    <ol id="leaderboard-list">
      <p class="no-data">Memuat data dari server...</p>
    </ol>
  </div>

  <script>
    // --- INTEGRASI FIREBASE REALTIME DATABASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyBOo74lEYtQGFC5_1NeDLPi0DuG2QhAK3g",
      authDomain: "bot-war-arena.firebaseapp.com",
      databaseURL: "https://bot-war-arena-default-rtdb.firebaseio.com",
      projectId: "bot-war-arena",
      storageBucket: "bot-war-arena.firebasestorage.app",
      messagingSenderId: "622360630602",
      appId: "1:622360630602:web:35fd02550b36605be55db3",
      measurementId: "G-X0T2H996NE"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const leaderboardList = document.getElementById("leaderboard-list");

    // Fungsi memuat leaderboard online secara realtime
    function loadLeaderboard() {
      db.ref('leaderboard').orderByChild('kills').limitToLast(5).on('value', (snapshot) => {
        leaderboardList.innerHTML = "";
        let scores = [];

        snapshot.forEach((child) => {
          scores.push(child.val());
        });

        // Urutkan dari Kill tertinggi ke terendah
        scores.sort((a, b) => b.kills - a.kills);

        if (scores.length === 0) {
          leaderboardList.innerHTML = `<p class="no-data">Belum ada skor. Jadilah nomor 1!</p>`;
          return;
        }

        scores.forEach((item) => {
          const li = document.createElement("li");
          li.innerHTML = `<b>${item.name}</b>: <span style="color:#22c55e">${item.kills} Kill</span>`;
          leaderboardList.appendChild(li);
        });
      });
    }

    // Fungsi simpan skor online ke Firebase Database
    function saveScore(name, killCount) {
      if (killCount === 0) return;
      db.ref('leaderboard').push({
        name: name,
        kills: killCount,
        timestamp: Date.now()
      });
    }

    // --- GAME ENGINE 3D ---
    const container = document.getElementById("game-container");
    const killsEl = document.getElementById("kills");
    const hpEl = document.getElementById("hp");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("start-btn");
    const msgTitle = document.getElementById("msg-title");
    const autoBtn = document.getElementById("auto-btn");
    const playerNameInput = document.getElementById("player-name");
    const shootBtn = document.getElementById("shoot-btn");

    let scene, camera, renderer;
    let playerMesh, playerHP = 100, kills = 0, isPlaying = false;
    let bullets = [], botBullets = [], bots = [];
    let keys = {}, lastMoveDir = { x: 0, z: -1 }, joystickDir = { x: 0, y: 0 };
    let botSpawner, autoShootInterval, autoShoot = false, playerName = "Player";
    const ARENA_SIZE = 26;

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);

      camera = new THREE.PerspectiveCamera(45, 340 / 280, 0.1, 1000);
      camera.position.set(0, 32, 22);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(340, 280);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      const gridHelper = new THREE.GridHelper(ARENA_SIZE, 16, 0xef4444, 0x334155);
      gridHelper.position.y = -0.5;
      scene.add(gridHelper);

      const pGroup = new THREE.Group();
      const bodyGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
      const bodyMat = new THREE.MeshPhongMaterial({ color: 0x38bdf8 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.castShadow = true;
      pGroup.add(body);

      const gunGeo = new THREE.BoxGeometry(0.3, 0.3, 0.8);
      const gunMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
      const gun = new THREE.Mesh(gunGeo, gunMat);
      gun.position.set(0, 0, -0.7);
      pGroup.add(gun);

      playerMesh = pGroup;
      scene.add(playerMesh);

      animate();
    }

    // MULTI-TOUCH JOYSTICK LOGIC
    const joyContainer = document.getElementById("joystick-container");
    const joyStick = document.getElementById("joystick-stick");
    const maxRadius = 28;
    let joystickTouchId = null;

    function processJoyMove(clientX, clientY) {
      const rect = joyContainer.getBoundingClientRect();
      let dx = clientX - (rect.left + rect.width / 2);
      let dy = clientY - (rect.top + rect.height / 2);
      let distance = Math.hypot(dx, dy);

      if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
      }

      joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
      joystickDir.x = dx / maxRadius;
      joystickDir.y = dy / maxRadius;

      if (Math.abs(joystickDir.x) > 0.05 || Math.abs(joystickDir.y) > 0.05) {
        lastMoveDir = { x: joystickDir.x, z: joystickDir.y };
      }
    }

    function resetJoy() {
      joystickTouchId = null;
      joyStick.style.transform = "translate(0px, 0px)";
      joystickDir = { x: 0, y: 0 };
    }

    window.addEventListener("touchstart", (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        let touch = e.changedTouches[i];
        const rect = joyContainer.getBoundingClientRect();
        if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
            touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
          if (joystickTouchId === null) {
            joystickTouchId = touch.identifier;
            processJoyMove(touch.clientX, touch.clientY);
          }
        }
      }
    }, { passive: false });

    window.addEventListener("touchmove", (e) => {
      if (joystickTouchId !== null) {
        for (let i = 0; i < e.changedTouches.length; i++) {
          let touch = e.changedTouches[i];
          if (touch.identifier === joystickTouchId) processJoyMove(touch.clientX, touch.clientY);
        }
      }
    }, { passive: false });

    window.addEventListener("touchend", (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joystickTouchId) resetJoy();
      }
    });

    shootBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      if (isPlaying) playerShoot();
    });
    shootBtn.addEventListener("mousedown", () => {
      if (isPlaying) playerShoot();
    });

    window.addEventListener("keydown", (e) => {
      keys[e.key] = true;
      if (e.code === "Space" && isPlaying) playerShoot();
    });
    window.addEventListener("keyup", (e) => keys[e.key] = false);

    function toggleAutoShoot() {
      autoShoot = !autoShoot;
      autoBtn.innerText = autoShoot ? "Auto Shoot: ON 🔥" : "Auto Shoot: OFF";
      autoBtn.style.background = autoShoot ? "#16a34a" : "#334155";

      if (autoShoot) {
        autoShootInterval = setInterval(() => { if (isPlaying) playerShoot(); }, 250);
      } else {
        clearInterval(autoShootInterval);
      }
    }

    function startGame() {
      playerName = playerNameInput.value.trim() || "Player";
      playerHP = 100;
      kills = 0;
      isPlaying = true;

      bullets.forEach(b => scene.remove(b.mesh));
      botBullets.forEach(bb => scene.remove(bb.mesh));
      bots.forEach(bot => scene.remove(bot.mesh));
      bullets = []; botBullets = []; bots = [];

      playerMesh.position.set(0, 0.6, 0);
      killsEl.innerText = kills;
      hpEl.innerText = playerHP;
      overlay.style.display = "none";

      if (botSpawner) clearInterval(botSpawner);
      botSpawner = setInterval(spawnBot, 1800);
    }

    function spawnBot() {
      if (!isPlaying) return;
      let side = Math.random() < 0.5 ? -1 : 1;
      let x = (Math.random() - 0.5) * ARENA_SIZE;
      let z = side * (ARENA_SIZE / 2);

      const botGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
      const botMat = new THREE.MeshPhongMaterial({ color: 0xef4444 });
      const mesh = new THREE.Mesh(botGeo, botMat);
      mesh.position.set(x, 0.6, z);
      scene.add(mesh);

      bots.push({ mesh: mesh, speed: 0.08, lastShoot: Date.now() });
    }

    function playerShoot() {
      if (!isPlaying) return;
      let mag = Math.hypot(lastMoveDir.x, lastMoveDir.z) || 1;
      let dx = (lastMoveDir.x / mag) * 0.4;
      let dz = (lastMoveDir.z / mag) * 0.4;

      const bGeo = new THREE.SphereGeometry(0.25, 8, 8);
      const bMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
      const mesh = new THREE.Mesh(bGeo, bMat);
      mesh.position.set(playerMesh.position.x, 0.6, playerMesh.position.z);
      scene.add(mesh);

      bullets.push({ mesh: mesh, dx: dx, dz: dz });
    }

    function updateGameLogic() {
      if (!isPlaying) return;

      let moveX = joystickDir.x;
      let moveZ = joystickDir.y;

      if (keys['ArrowUp'] || keys['w']) moveZ = -1;
      if (keys['ArrowDown'] || keys['s']) moveZ = 1;
      if (keys['ArrowLeft'] || keys['a']) moveX = -1;
      if (keys['ArrowRight'] || keys['d']) moveX = 1;

      if (moveX !== 0 || moveZ !== 0) {
        playerMesh.position.x += moveX * 0.12;
        playerMesh.position.z += moveZ * 0.12;
        lastMoveDir = { x: moveX, z: moveZ };

        let angle = Math.atan2(moveX, moveZ);
        playerMesh.rotation.y = angle + Math.PI;
      }

      const limit = (ARENA_SIZE / 2) - 1;
      playerMesh.position.x = Math.max(-limit, Math.min(limit, playerMesh.position.x));
      playerMesh.position.z = Math.max(-limit, Math.min(limit, playerMesh.position.z));

      bullets.forEach((b, index) => {
        b.mesh.position.x += b.dx;
        b.mesh.position.z += b.dz;
        if (Math.abs(b.mesh.position.x) > limit || Math.abs(b.mesh.position.z) > limit) {
          scene.remove(b.mesh);
          bullets.splice(index, 1);
        }
      });

      bots.forEach((bot, bIndex) => {
        let dx = playerMesh.position.x - bot.mesh.position.x;
        let dz = playerMesh.position.z - bot.mesh.position.z;
        let angle = Math.atan2(dx, dz);

        bot.mesh.position.x += Math.sin(angle) * bot.speed;
        bot.mesh.position.z += Math.cos(angle) * bot.speed;
        bot.mesh.rotation.y = angle;

        if (Date.now() - bot.lastShoot > 1500) {
          const bbGeo = new THREE.SphereGeometry(0.2, 8, 8);
          const bbMat = new THREE.MeshBasicMaterial({ color: 0xfb923c });
          const bbMesh = new THREE.Mesh(bbGeo, bbMat);
          bbMesh.position.set(bot.mesh.position.x, 0.6, bot.mesh.position.z);
          scene.add(bbMesh);

          botBullets.push({
            mesh: bbMesh,
            dx: Math.sin(angle) * 0.25,
            dz: Math.cos(angle) * 0.25
          });
          bot.lastShoot = Date.now();
        }

        bullets.forEach((b, pIndex) => {
          let dist = b.mesh.position.distanceTo(bot.mesh.position);
          if (dist < 0.9) {
            scene.remove(bot.mesh);
            scene.remove(b.mesh);
            bots.splice(bIndex, 1);
            bullets.splice(pIndex, 1);
            kills++;
            killsEl.innerText = kills;
          }
        });
      });

      botBullets.forEach((bb, index) => {
        bb.mesh.position.x += bb.dx;
        bb.mesh.position.z += bb.dz;

        let dist = bb.mesh.position.distanceTo(playerMesh.position);
        if (dist < 0.8) {
          scene.remove(bb.mesh);
          botBullets.splice(index, 1);
          playerHP -= 10;
          hpEl.innerText = playerHP;

          if (playerHP <= 0) gameOver();
        }

        if (Math.abs(bb.mesh.position.x) > limit || Math.abs(bb.mesh.position.z) > limit) {
          scene.remove(bb.mesh);
          botBullets.splice(index, 1);
        }
      });
    }

    function gameOver() {
      isPlaying = false;
      clearInterval(botSpawner);
      if (autoShootInterval) clearInterval(autoShootInterval);
      
      saveScore(playerName, kills);
      
      msgTitle.innerText = "KAMU GUGUR!";
      startBtn.innerText = "MAIN LAGI 🔄";
      overlay.style.display = "flex";
    }

    function animate() {
      requestAnimationFrame(animate);
      updateGameLogic();
      renderer.render(scene, camera);
    }

    init3D();
    loadLeaderboard();
  </script>
</body>
</html>
