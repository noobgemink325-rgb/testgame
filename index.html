<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game - Fixed Score</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0f172a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 {
      margin-bottom: 5px;
      color: #22c55e;
      font-size: 26px;
    }
    .score-board {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    #game-container {
      position: relative;
      border: 3px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    canvas {
      background: #1e293b;
      display: block;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #start-btn {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: #22c55e;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
    }
    #start-btn:active {
      transform: scale(0.95);
    }
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 55px);
      grid-template-rows: repeat(2, 55px);
      gap: 6px;
      margin-top: 15px;
    }
    .d-btn {
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }
    .d-btn:active {
      background: #475569;
    }
  </style>
</head>
<body>

  <h1>Ular Retro 🐍</h1>
  <div class="score-board">Skor: <span id="score">0</span></div>

  <div id="game-container">
    <canvas id="canvas" width="300" height="300"></canvas>
    
    <div id="overlay">
      <h2 id="msg-title" style="margin-bottom: 15px; color: #38bdf8;">Siap Main?</h2>
      <button id="start-btn" onclick="startGame()">MULAI GAME</button>
    </div>
  </div>

  <div class="d-pad">
    <div></div>
    <button class="d-btn" onclick="changeDir('UP')">▲</button>
    <div></div>
    <button class="d-btn" onclick="changeDir('LEFT')">◄</button>
    <button class="d-btn" onclick="changeDir('DOWN')">▼</button>
    <button class="d-btn" onclick="changeDir('RIGHT')">►</button>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("start-btn");
    const msgTitle = document.getElementById("msg-title");

    const gridSize = 15;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = { x: 0, y: 0 };
    let dx = gridSize;
    let dy = 0;
    let score = 0;
    let gameInterval = null;

    function startGame() {
      // Reset Nilai Game
      snake = [
        { x: 5 * gridSize, y: 5 * gridSize },
        { x: 4 * gridSize, y: 5 * gridSize }
      ];
      dx = gridSize;
      dy = 0;
      score = 0;
      scoreEl.innerText = score;
      
      spawnFood();
      overlay.style.display = "none";

      if(gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, 120);
    }

    function spawnFood() {
      // Bikin lokasi makanan acak yang tidak kena badan ular
      let validPosition = false;
      while (!validPosition) {
        food.x = Math.floor(Math.random() * tileCount) * gridSize;
        food.y = Math.floor(Math.random() * tileCount) * gridSize;

        validPosition = true;
        for (let i = 0; i < snake.length; i++) {
          if (snake[i].x === food.x && snake[i].y === food.y) {
            validPosition = false;
            break;
          }
        }
      }
    }

    function changeDir(dir) {
      if (dir === 'LEFT' && dx === 0) { dx = -gridSize; dy = 0; }
      if (dir === 'UP' && dy === 0) { dx = 0; dy = -gridSize; }
      if (dir === 'RIGHT' && dx === 0) { dx = gridSize; dy = 0; }
      if (dir === 'DOWN' && dy === 0) { dx = 0; dy = gridSize; }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") changeDir('LEFT');
      if (e.key === "ArrowUp" || e.key === "w") changeDir('UP');
      if (e.key === "ArrowRight" || e.key === "d") changeDir('RIGHT');
      if (e.key === "ArrowDown" || e.key === "s") changeDir('DOWN');
    });

    function gameLoop() {
      // Hitung posisi kepala baru
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Nabrak tembok
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        return gameOver();
      }

      // Nabrak badan sendiri
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          return gameOver();
        }
      }

      // Masukkan kepala ke depan
      snake.unshift(head);

      // Cek Makan Makanan
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.innerText = score; // Update Tampilan Skor di Layar
        spawnFood();
      } else {
        snake.pop(); // Hapus ekor kalau gak makan
      }

      draw();
    }

    function draw() {
      // Gambar Ulang Layar
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Gambar Makanan (Merah)
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(food.x, food.y, gridSize - 2, gridSize - 2);

      // Gambar Ular (Hijau)
      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#22c55e" : "#4ade80";
        ctx.fillRect(part.x, part.y, gridSize - 2, gridSize - 2);
      });
    }

    function gameOver() {
      clearInterval(gameInterval);
      msgTitle.innerText = "GAME OVER!";
      msgTitle.style.color = "#ef4444";
      startBtn.innerText = "MAIN LAGI";
      overlay.style.display = "flex";
    }
  </script>
</body>
</html>
