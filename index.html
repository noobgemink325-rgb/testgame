<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>War Thunder 3D - Clean UI Style</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 10px 0;
      overflow: hidden;
    }

    /* BANNER JUDUL MERAH DARI DESAIN */
    .title-banner {
      background: #ef4444;
      color: #fff;
      font-weight: 900;
      font-size: 18px;
      padding: 8px 24px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    }

    .score-board {
      font-size: 11px;
      margin-bottom: 6px;
      color: #cbd5e1;
      text-align: center;
      line-height: 1.4;
    }

    #game-container {
      position: relative;
      width: 340px;
      height: 280px;
      border: 3px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.2);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* CONTAINER OVERLAY UTAMA (KAPSUL ABU-ABU) */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 10px;
    }

    .menu-capsule {
      background: #808080;
      width: 230px;
      border-radius: 40px;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }

    /* TOMBOL PUTIH BERSIH TUMPUL */
    .btn-ui {
      width: 100%;
      padding: 8px 0;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }
    .btn-ui:active {
      transform: scale(0.95);
    }

    /* SUBMENU MODAL UI */
    .sub-panel {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    input[type="text"] {
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #000;
      background: #fff;
      color: #000;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      width: 100%;
      outline: none;
    }

    .mode-tabs {
      display: flex;
      gap: 4px;
      width: 100%;
    }
    .btn-tab {
      flex: 1;
      padding: 5px;
      font-size: 9px;
      font-weight: bold;
      border-radius: 6px;
      border: none;
      background: #333;
      color: #fff;
      cursor: pointer;
    }
    .btn-tab.active {
      background: #ef4444;
      color: #fff;
    }

    /* IN-GAME FLOATING ADMIN BUTTON & MODAL */
    #admin-toggle-btn {
      display: none;
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 20;
      background: #6366f1;
      color: #fff;
      border: 1px solid #818cf8;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 16px;
      cursor: pointer;
    }

    #owner-modal {
      display: none;
      position: absolute;
      top: 35px;
      right: 8px;
      width: 220px;
      background: rgba(30, 27, 75, 0.95);
      border: 2px solid #6366f1;
      border-radius: 8px;
      padding: 8px;
      z-index: 25;
    }
    #owner-modal h4 {
      font-size: 10px;
      color: #a5b4fc;
      margin-bottom: 6px;
      text-align: center;
    }
    .owner-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }
    .btn-owner {
      padding: 4px 2px;
      font-size: 8px;
      font-weight: bold;
      background: #4338ca;
      color: #fff;
      border: 1px solid #818cf8;
      border-radius: 4px;
      cursor: pointer;
    }

    /* JOYSTICK CONTROLS */
    .controls-wrapper {
      width: 340px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding: 0 10px;
    }
    .joystick-base {
      width: 85px;
      height: 85px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      position: relative;
      touch-action: none;
    }
    #move-joy { border: 2px solid rgba(56, 189, 248, 0.5); }
    #attack-joy { border: 2px solid rgba(239, 68, 68, 0.5); }

    .joystick-stick {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      position: absolute;
      top: 23px;
      left: 23px;
      pointer-events: none;
    }
    #move-stick { background: #38bdf8; }
    #attack-stick { background: #ef4444; }

    .weapon-selector {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .btn-weapon {
      background: #0284c7;
      color: #fff;
      border: 1px solid #38bdf8;
      padding: 6px 10px;
      font-size: 10px;
      border-radius: 6px;
      font-weight: bold;
    }

    /* LEADERBOARD IN-GAME POPUP */
    .leaderboard-box {
      display: none;
      width: 100%;
      max-height: 120px;
      overflow-y: auto;
      background: rgba(0,0,0,0.8);
      border-radius: 8px;
      padding: 4px 8px;
      text-align: left;
    }
    .leaderboard-title {
      font-size: 10px;
      color: #facc15;
      font-weight: bold;
      text-align: center;
      margin-bottom: 2px;
    }
    ol { padding-left: 18px; font-size: 10px; color: #cbd5e1; }
    .no-data { color: #64748b; font-size: 9px; text-align: center; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- HEADER BENNER MERAH -->
  <div class="title-banner">WAR THUNDER 3D</div>

  <div class="score-board">
    Kill: <span id="kills" style="color:#22c55e; font-weight:bold;">0</span> | 
    HP: <span id="hp" style="color:#ef4444; font-weight:bold;">100</span> | 
    Lvl: <span id="player-level" style="color:#38bdf8; font-weight:bold;">1</span><br>
    Wave: <span id="wave-num" style="color:#facc15; font-weight:bold;">1</span> | 
    Dmg Bot: <span id="bot-dmg" style="color:#f43f5e; font-weight:bold;">10</span>
  </div>

  <div id="game-container">
    <button id="admin-toggle-btn" onclick="toggleOwnerModal()">⚙️</button>

    <div id="owner-modal">
      <h4>⚡ OWNER MENU IN-GAME ⚡</h4>
      <div class="owner-btns">
        <button class="btn-owner" onclick="toggleGodMode()">GOD MODE: OFF</button>
        <button class="btn-owner" id="sword-btn-owner" onclick="unlockAdminSword()">PEDANG OP: OFF ⚔</button>
        <button class="btn-owner" onclick="triggerNukeBomb()">NUKE / BOMB 💣</button>
        <button class="btn-owner" onclick="addInstantKills()">+10 KILLS</button>
        <button class="btn-owner" onclick="spawnEnemyWave()">SPAWN WAVE 🌊</button>
        <button class="btn-owner" onclick="toggleSpeedBoost()" id="speed-btn">SPEED 2X: OFF ⚡</button>
        <button class="btn-owner" onclick="clearAllBots()">CLEAR BOTS</button>
        <button class="btn-owner" style="background:#b91c1c; border-color:#f87171;" onclick="resetLeaderboard()">RESET LB 🧹</button>
      </div>
    </div>

    <!-- OVERLAY MENU KAPSUL ABU-ABU -->
    <div id="overlay">
      <div class="menu-capsule">
        
        <!-- MENU UTAMA KAPSUL -->
        <div id="main-menu-view" style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
          <button class="btn-ui" onclick="showSubPanel('play')">PLAY</button>
          <button class="btn-ui" onclick="showSubPanel('setting')">SETTING</button>
          <button class="btn-ui" onclick="showSubPanel('leaderboard')">LEADERBOARD</button>
          <button class="btn-ui" onclick="leaveGame()">LEAVE</button>
        </div>

        <!-- PANEL SUB-MENU PLAY -->
        <div id="panel-play" class="sub-panel">
          <div class="mode-tabs">
            <button id="tab-solo-btn" class="btn-tab active" onclick="switchGameMode('solo')">SOLO</button>
            <button id="tab-coop-btn" class="btn-tab" onclick="switchGameMode('coop')">CO-OP</button>
          </div>
          <input type="text" id="player-name" placeholder="Nickname..." maxlength="12">
          
          <div id="coop-group" style="display:none; width:100%; gap:4px; margin-top:2px;">
            <button class="btn-tab" style="background:#0284c7;" onclick="createRoom()">BUAT ROOM</button>
            <button class="btn-tab" style="background:#334155;" onclick="joinRoomPrompt()">JOIN ROOM</button>
          </div>
          <input type="text" id="room-code-input" placeholder="Kode Room (4 Digit)" maxlength="4" style="display:none;">

          <button class="btn-ui" style="background:#22c55e; color:#fff;" onclick="startGame()">START 🚀</button>
          <button class="btn-ui" style="padding:4px 0; font-size:10px; background:#475569; color:#fff;" onclick="showMainMenu()">KEMBALI</button>
        </div>

        <!-- PANEL SUB-MENU SETTING -->
        <div id="panel-setting" class="sub-panel">
          <p style="font-size:10px; color:#fff;">Ketik Passcode Admin:</p>
          <input type="text" id="passcode-input" placeholder="Passcode..." oninput="checkOwnerKey(this.value)">
          <button class="btn-ui" style="padding:4px 0; font-size:10px; background:#475569; color:#fff; margin-top:4px;" onclick="showMainMenu()">KEMBALI</button>
        </div>

        <!-- PANEL SUB-MENU LEADERBOARD -->
        <div id="panel-leaderboard" class="sub-panel">
          <div class="mode-tabs">
            <button class="btn-tab active" id="lb-tab-solo" onclick="switchLeaderboardTab('solo')">SOLO</button>
            <button class="btn-tab" id="lb-tab-coop" onclick="switchLeaderboardTab('coop')">CO-OP</button>
          </div>
          <div class="leaderboard-box" id="lb-box-container" style="display:block;">
            <ol id="leaderboard-list">
              <p class="no-data">Memuat data...</p>
            </ol>
          </div>
          <button class="btn-ui" style="padding:4px 0; font-size:10px; background:#475569; color:#fff;" onclick="showMainMenu()">KEMBALI</button>
        </div>

      </div>
    </div>
  </div>

  <div class="controls-wrapper">
    <div id="move-joy" class="joystick-base">
      <div id="move-stick" class="joystick-stick"></div>
    </div>

    <div class="weapon-selector">
      <button class="btn-weapon" id="weapon-btn" onclick="toggleWeapon()">PISTOL 🔫</button>
      <span style="font-size:9px; color:#64748b;">Joy Merah = Serang</span>
    </div>

    <div id="attack-joy" class="joystick-base">
      <div id="attack-stick" class="joystick-stick"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBOo74lEYtQGFC5_1NeDLPi0DuG2QhAK3g",
      authDomain: "bot-war-arena.firebaseapp.com",
      databaseURL: "https://bot-war-arena-default-rtdb.firebaseio.com",
      projectId: "bot-war-arena",
      storageBucket: "bot-war-arena.firebasestorage.app",
      messagingSenderId: "622360630602",
      appId: "1:622360630602:web:35fd02550b36605be55db3",
      measurementId: "G-X0T2H996NE"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const OWNER_PASSCODE = "OWNER123";
    let isGodMode = false;
    let isAdminSwordUnlocked = false;
    let isSpeedBoosted = false;
    let playerMoveSpeed = 0.12;

    let gameMode = 'solo';
    let roomId = null;
    let playerRole = null;
    let roomRef = null;
    let p1Name = "P1", p2Name = "P2";
    let lastHitTime = 0;
    let currentScoreRef = null;

    let playerLevel = 1;
    let currentWave = 1;
    let botBaseDamage = 10;
    let healItems = [];

    // NAVIGATION UI CONTROL
    function showMainMenu() {
      document.getElementById('main-menu-view').style.display = 'flex';
      document.getElementById('panel-play').style.display = 'none';
      document.getElementById('panel-setting').style.display = 'none';
      document.getElementById('panel-leaderboard').style.display = 'none';
    }

    function showSubPanel(panelName) {
      document.getElementById('main-menu-view').style.display = 'none';
      document.getElementById('panel-play').style.display = panelName === 'play' ? 'flex' : 'none';
      document.getElementById('panel-setting').style.display = panelName === 'setting' ? 'flex' : 'none';
      document.getElementById('panel-leaderboard').style.display = panelName === 'leaderboard' ? 'flex' : 'none';

      if (panelName === 'leaderboard') {
        switchLeaderboardTab('solo');
      }
    }

    function leaveGame() {
      if (confirm("Keluar dari game?")) {
        window.close();
      }
    }

    function checkOwnerKey(val) {
      if (val.trim().toUpperCase() === OWNER_PASSCODE) {
        document.getElementById("admin-toggle-btn").style.display = "block";
        alert("Passcode Admin Benar! Tombol ⚙️ telah aktif.");
      }
    }

    function toggleOwnerModal() {
      const modal = document.getElementById("owner-modal");
      modal.style.display = modal.style.display === "block" ? "none" : "block";
    }

    function toggleGodMode() {
      isGodMode = !isGodMode;
      const btn = event.target;
      if (isGodMode) {
        playerHP = 9999;
        const hpEl = document.getElementById("hp");
        if (hpEl) hpEl.innerText = "9999 (GOD)";
        btn.innerText = "GOD MODE: ON 🛡️";
        btn.style.background = "#16a34a";
      } else {
        playerHP = 100;
        const hpEl = document.getElementById("hp");
        if (hpEl) hpEl.innerText = playerHP;
        btn.innerText = "GOD MODE: OFF";
        btn.style.background = "#4338ca";
      }
    }

    function toggleSpeedBoost() {
      isSpeedBoosted = !isSpeedBoosted;
      const btn = document.getElementById("speed-btn");
      if (isSpeedBoosted) {
        playerMoveSpeed = 0.25;
        btn.innerText = "SPEED 2X: ON ⚡";
        btn.style.background = "#16a34a";
      } else {
        playerMoveSpeed = 0.12;
        btn.innerText = "SPEED 2X: OFF ⚡";
        btn.style.background = "#4338ca";
      }
    }

    function unlockAdminSword() {
      isAdminSwordUnlocked = !isAdminSwordUnlocked;
      const btn = document.getElementById("sword-btn-owner");
      if (isAdminSwordUnlocked) {
        btn.innerText = "PEDANG OP: UNLOCKED ⚔️";
        btn.style.background = "#d97706";
        currentWeapon = "ADMIN_SWORD";
        weaponBtn.innerText = "PEDANG OP ⚔️";
        weaponBtn.style.background = "#b45309";
      } else {
        btn.innerText = "PEDANG OP: OFF ⚔️";
        btn.style.background = "#4338ca";
        currentWeapon = "PISTOL";
        weaponBtn.innerText = "PISTOL 🔫";
        weaponBtn.style.background = "#0284c7";
      }
    }

    function addInstantKills() {
      kills += 10;
      checkPlayerLevel();
      const killsEl = document.getElementById("kills");
      if (killsEl) killsEl.innerText = kills;
      if (gameMode === 'coop' && roomRef) roomRef.update({ kills: kills });
      syncRealtimeScore();
    }

    function triggerNukeBomb() {
      triggerExplosionAOE(new THREE.Vector3(0, 0, 0));
    }

    function spawnEnemyWave() {
      for(let i=0; i<10; i++) {
        spawnBotHost();
      }
    }

    function clearAllBots() {
      bots.forEach(bot => scene.remove(bot.mesh));
      bots = [];
      if (gameMode === 'coop' && roomRef) roomRef.child('bots').remove();
    }

    function resetLeaderboard() {
      if (confirm("Yakin mau hapus seluruh isi Leaderboard Global?")) {
        db.ref(gameMode === 'solo' ? 'leaderboard_solo' : 'leaderboard_coop').remove();
        alert("Leaderboard telah dibersihkan!");
      }
    }

    function switchGameMode(mode) {
      gameMode = mode;
      const tabSolo = document.getElementById("tab-solo-btn");
      const tabCoop = document.getElementById("tab-coop-btn");
      const coopGroup = document.getElementById("coop-group");

      if (mode === 'solo') {
        tabSolo.classList.add("active");
        tabCoop.classList.remove("active");
        coopGroup.style.display = "none";
      } else {
        tabCoop.classList.add("active");
        tabSolo.classList.remove("active");
        coopGroup.style.display = "flex";
      }
    }

    function switchLeaderboardTab(type) {
      document.getElementById('lb-tab-solo').classList.toggle('active', type === 'solo');
      document.getElementById('lb-tab-coop').classList.toggle('active', type === 'coop');

      db.ref(type === 'solo' ? 'leaderboard_solo' : 'leaderboard_coop').orderByChild('kills').on('value', (snapshot) => {
        renderLeaderboardData(snapshot, type === 'coop');
      });
    }

    function renderLeaderboardData(snapshot, isCoop) {
      const list = document.getElementById("leaderboard-list");
      list.innerHTML = "";
      let scores = [];

      snapshot.forEach((child) => {
        scores.push(child.val());
      });

      scores.sort((a, b) => b.kills - a.kills);

      if (scores.length === 0) {
        list.innerHTML = `<p class="no-data">Belum ada rekor global.</p>`;
        return;
      }

      scores.slice(0, 10).forEach((item) => {
        const li = document.createElement("li");
        const nameText = isCoop ? (item.team || item.name) : item.name;
        li.innerHTML = `<b>${nameText}</b>: <span style="color:#22c55e">${item.kills} Kill</span>`;
        list.appendChild(li);
      });
    }

    function syncRealtimeScore() {
      if (kills <= 0) return;
      let rawName = document.getElementById('player-name').value.trim();

      if (gameMode === 'solo') {
        let validName = rawName !== "" ? rawName : "Player";
        if (!currentScoreRef) {
          currentScoreRef = db.ref('leaderboard_solo').push();
        }
        currentScoreRef.set({ name: validName, kills: kills, timestamp: Date.now() });
      } else if (gameMode === 'coop') {
        let validP1 = (p1Name && p1Name !== "" && p1Name !== "P1") ? p1Name : "P1";
        let validP2 = (p2Name && p2Name !== "" && p2Name !== "P2" && p2Name !== "Menunggu...") ? p2Name : "P2";
        let teamName = `${validP1} & ${validP2}`;

        db.ref(`leaderboard_coop/${roomId || 'coop_room'}`).set({ 
          team: teamName, 
          kills: kills, 
          timestamp: Date.now() 
        });
      }
    }

    function createRoom() {
      roomId = Math.floor(1000 + Math.random() * 9000).toString();
      playerRole = 'p1';
      let rawName = document.getElementById('player-name').value.trim();
      p1Name = rawName !== "" ? rawName : 'P1';
      
      roomRef = db.ref(`rooms/${roomId}`);
      roomRef.set({
        status: 'waiting',
        p1: { name: p1Name, x: -2, z: 0, hp: 100 },
        p2: { name: 'Menunggu...', x: 2, z: 0, hp: 100 },
        kills: 0
      });
      alert(`Kode Room: ${roomId}`);
      listenToRoom();
    }

    function joinRoomPrompt() {
      const codeInput = document.getElementById('room-code-input');
      if (codeInput.style.display === 'none') {
        codeInput.style.display = 'block';
        return;
      }
      roomId = codeInput.value.trim();
      if (!roomId) return alert("Masukkan kode room!");

      playerRole = 'p2';
      let rawName = document.getElementById('player-name').value.trim();
      p2Name = rawName !== "" ? rawName : 'P2';
      
      roomRef = db.ref(`rooms/${roomId}`);
      roomRef.get().then((snapshot) => {
        if (snapshot.exists()) {
          const val = snapshot.val();
          p1Name = (val.p1 && val.p1.name) ? val.p1.name : 'P1';
          roomRef.child('p2').set({ name: p2Name, x: 2, z: 0, hp: 100 });
          listenToRoom();
        } else {
          alert("Room tidak ditemukan!");
        }
      });
    }

    function listenToRoom() {
      if (!roomRef) return;
      roomRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data || gameMode === 'solo') return;

        if (data.p1 && data.p1.name) p1Name = data.p1.name;
        if (data.p2 && data.p2.name && data.p2.name !== 'Menunggu...') p2Name = data.p2.name;

        const otherRole = playerRole === 'p1' ? 'p2' : 'p1';
        if (data[otherRole] && otherPlayerMesh) {
          otherPlayerMesh.position.x = data[otherRole].x;
          otherPlayerMesh.position.z = data[otherRole].z;
        }

        if (data.status === 'playing' && !isPlaying) {
          startGameLocal();
        } else if (data.status === 'gameover' && isPlaying) {
          triggerLocalGameOver();
        }

        if (data.kills !== undefined) {
          kills = data.kills;
          checkPlayerLevel();
          const killsEl = document.getElementById("kills");
          if (killsEl) killsEl.innerText = kills;
        }
      });

      roomRef.child('bots').on('child_added', (snapshot) => {
        if (gameMode === 'coop' && playerRole === 'p2') {
          const bData = snapshot.val();
          spawnRemoteBot(snapshot.key, bData.x, bData.z);
        }
      });

      roomRef.child('bots').on('child_removed', (snapshot) => {
        if (gameMode === 'coop') {
          const key = snapshot.key;
          const bIndex = bots.findIndex(b => b.key === key);
          if (bIndex !== -1) {
            scene.remove(bots[bIndex].mesh);
            bots.splice(bIndex, 1);
          }
        }
      });

      roomRef.child('bullets').on('child_added', (snapshot) => {
        if (gameMode === 'coop') {
          const b = snapshot.val();
          if (b.owner !== playerRole) spawnRemoteBullet(b);
        }
      });
    }

    const container = document.getElementById("game-container");
    const overlay = document.getElementById("overlay");
    const weaponBtn = document.getElementById("weapon-btn");

    let scene, camera, renderer;
    let playerMesh, otherPlayerMesh, playerHP = 100, kills = 0, isPlaying = false;
    let bullets = [], botBullets = [], bots = [];
    let keys = {}, moveJoyDir = { x: 0, y: 0 }, attackJoyDir = { x: 0, y: 0 };
    let botSpawner;
    let currentWeapon = "PISTOL";
    let lastShootTime = 0;
    const ARENA_SIZE = 26;

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);

      camera = new THREE.PerspectiveCamera(45, 340 / 280, 0.1, 1000);
      camera.position.set(0, 32, 22);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(340, 280);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      const gridHelper = new THREE.GridHelper(ARENA_SIZE, 16, 0xef4444, 0x334155);
      gridHelper.position.y = -0.5;
      scene.add(gridHelper);

      playerMesh = createPlayerMesh(0x38bdf8);
      scene.add(playerMesh);

      otherPlayerMesh = createPlayerMesh(0x22c55e);
      scene.add(otherPlayerMesh);

      animate();
    }

    function createPlayerMesh(colorHex) {
      const pGroup = new THREE.Group();
      const bodyGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
      const bodyMat = new THREE.MeshPhongMaterial({ color: colorHex });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.castShadow = true;
      pGroup.add(body);

      const gunGeo = new THREE.BoxGeometry(0.3, 0.3, 0.8);
      const gunMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
      const gun = new THREE.Mesh(gunGeo, gunMat);
      gun.position.set(0, 0, -0.7);
      gun.name = "default_gun";
      pGroup.add(gun);

      const swordGeo = new THREE.BoxGeometry(0.15, 1.8, 0.3);
      const swordMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
      const sword = new THREE.Mesh(swordGeo, swordMat);
      sword.position.set(0.6, 0.4, -0.6);
      sword.rotation.x = Math.PI / 3;
      sword.name = "admin_sword_mesh";
      sword.visible = false;
      pGroup.add(sword);

      return pGroup;
    }

    const moveJoyContainer = document.getElementById("move-joy");
    const moveStick = document.getElementById("move-stick");
    const attackJoyContainer = document.getElementById("attack-joy");
    const attackStick = document.getElementById("attack-stick");
    const maxRadius = 26;

    let moveTouchId = null;
    let attackTouchId = null;

    function handleJoystickMove(touch, container, stick, dirObj) {
      const rect = container.getBoundingClientRect();
      let dx = touch.clientX - (rect.left + rect.width / 2);
      let dy = touch.clientY - (rect.top + rect.height / 2);
      let dist = Math.hypot(dx, dy);

      if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
      }

      stick.style.transform = `translate(${dx}px, ${dy}px)`;
      dirObj.x = dx / maxRadius;
      dirObj.y = dy / maxRadius;
    }

    window.addEventListener("touchstart", (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        let touch = e.changedTouches[i];
        
        const mRect = moveJoyContainer.getBoundingClientRect();
        if (touch.clientX >= mRect.left && touch.clientX <= mRect.right &&
            touch.clientY >= mRect.top && touch.clientY <= mRect.bottom) {
          if (moveTouchId === null) {
            moveTouchId = touch.identifier;
            handleJoystickMove(touch, moveJoyContainer, moveStick, moveJoyDir);
          }
        }

        const aRect = attackJoyContainer.getBoundingClientRect();
        if (touch.clientX >= aRect.left && touch.clientX <= aRect.right &&
            touch.clientY >= aRect.top && touch.clientY <= aRect.bottom) {
          if (attackTouchId === null) {
            attackTouchId = touch.identifier;
            handleJoystickMove(touch, attackJoyContainer, attackStick, attackJoyDir);
          }
        }
      }
    }, { passive: false });

    window.addEventListener("touchmove", (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        let touch = e.changedTouches[i];
        if (touch.identifier === moveTouchId) {
          handleJoystickMove(touch, moveJoyContainer, moveStick, moveJoyDir);
        }
        if (touch.identifier === attackTouchId) {
          handleJoystickMove(touch, attackJoyContainer, attackStick, attackJoyDir);
        }
      }
    }, { passive: false });

    window.addEventListener("touchend", (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        let touch = e.changedTouches[i];
        if (touch.identifier === moveTouchId) {
          moveTouchId = null;
          moveStick.style.transform = "translate(0px, 0px)";
          moveJoyDir = { x: 0, y: 0 };
        }
        if (touch.identifier === attackTouchId) {
          attackTouchId = null;
          attackStick.style.transform = "translate(0px, 0px)";
          attackJoyDir = { x: 0, y: 0 };
        }
      }
    });

    window.addEventListener("keydown", (e) => keys[e.key] = true);
    window.addEventListener("keyup", (e) => keys[e.key] = false);

    function toggleWeapon() {
      if (currentWeapon === "PISTOL") {
        currentWeapon = "BAZOKA";
        weaponBtn.innerText = "BAZOKA 🚀";
        weaponBtn.style.background = "#d97706";
      } else if (currentWeapon === "BAZOKA") {
        if (isAdminSwordUnlocked) {
          currentWeapon = "ADMIN_SWORD";
          weaponBtn.innerText = "PEDANG OP ⚔️";
          weaponBtn.style.background = "#b45309";
        } else {
          currentWeapon = "PISTOL";
          weaponBtn.innerText = "PISTOL 🔫";
          weaponBtn.style.background = "#0284c7";
        }
      } else {
        currentWeapon = "PISTOL";
        weaponBtn.innerText = "PISTOL 🔫";
        weaponBtn.style.background = "#0284c7";
      }

      const sMesh = playerMesh.getObjectByName("admin_sword_mesh");
      const gMesh = playerMesh.getObjectByName("default_gun");
      if (sMesh && gMesh) {
        sMesh.visible = (currentWeapon === "ADMIN_SWORD");
        gMesh.visible = (currentWeapon !== "ADMIN_SWORD");
      }
    }

    function checkPlayerLevel() {
      playerLevel = Math.floor(kills / 5) + 1;
      currentWave = Math.floor(kills / 8) + 1;
      botBaseDamage = 10 + (currentWave - 1) * 2;

      document.getElementById("player-level").innerText = playerLevel;
      document.getElementById("wave-num").innerText = currentWave;
      document.getElementById("bot-dmg").innerText = botBaseDamage;
    }

    function spawnHealOrb(x, z) {
      if (Math.random() < 0.4) {
        const orbGeo = new THREE.SphereGeometry(0.4, 8, 8);
        const orbMat = new THREE.MeshBasicMaterial({ color: 0x22c55e });
        const orb = new THREE.Mesh(orbGeo, orbMat);
        orb.position.set(x, 0.4, z);
        scene.add(orb);
        healItems.push(orb);
      }
    }

    function startGame() {
      if (gameMode === 'solo') {
        playerRole = 'p1';
        startGameLocal();
      } else if (playerRole === 'p1' && roomRef) {
        roomRef.update({ status: 'playing', kills: 0, bots: null, bullets: null });
      }
    }

    function startGameLocal() {
      playerHP = isGodMode ? 9999 : 100;
      kills = 0;
      playerLevel = 1;
      currentWave = 1;
      botBaseDamage = 10;
      isPlaying = true;
      currentScoreRef = null;

      bullets.forEach(b => scene.remove(b.mesh));
      botBullets.forEach(bb => scene.remove(bb.mesh));
      bots.forEach(bot => scene.remove(bot.mesh));
      healItems.forEach(h => scene.remove(h));
      bullets = []; botBullets = []; bots = []; healItems = [];

      playerMesh.position.set(playerRole === 'p1' ? -2 : 2, 0.6, 0);
      otherPlayerMesh.visible = (gameMode !== 'solo');

      checkPlayerLevel();
      const killsEl = document.getElementById("kills");
      const hpEl = document.getElementById("hp");
      if (killsEl) killsEl.innerText = kills;
      if (hpEl) hpEl.innerText = isGodMode ? "9999 (GOD)" : playerHP;
      overlay.style.display = "none";

      if (botSpawner) clearInterval(botSpawner);
      if (gameMode === 'solo' || playerRole === 'p1') {
        let intervalTime = Math.max(500, 1500 - (currentWave * 100));
        botSpawner = setInterval(spawnBotHost, intervalTime);
      }
    }

    function spawnBotHost() {
      if (!isPlaying) return;
      let side = Math.random() < 0.5 ? -1 : 1;
      let x = (Math.random() - 0.5) * ARENA_SIZE;
      let z = side * (ARENA_SIZE / 2);

      if (gameMode === 'solo') {
        spawnRemoteBot(Date.now().toString(), x, z);
      } else if (playerRole === 'p1' && roomRef) {
        const botRef = roomRef.child('bots').push();
        botRef.set({ x: x, z: z });
        spawnRemoteBot(botRef.key, x, z);
      }
    }

    function spawnRemoteBot(key, x, z) {
      const botGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
      const botMat = new THREE.MeshPhongMaterial({ color: 0xef4444 });
      const mesh = new THREE.Mesh(botGeo, botMat);
      mesh.position.set(x, 0.6, z);
      scene.add(mesh);

      bots.push({ key: key, mesh: mesh, speed: 0.05 });
    }

    function executeAttack(aimDirX, aimDirZ) {
      if (!isPlaying) return;

      const now = Date.now();
      let cooldown = 250;
      if (currentWeapon === "BAZOKA") cooldown = 1000;
      if (currentWeapon === "ADMIN_SWORD") cooldown = 150;

      if (now - lastShootTime < cooldown) return;
      lastShootTime = now;

      if (currentWeapon === "ADMIN_SWORD") {
        triggerAdminSwordSlash();
        return;
      }

      let speedScale = 0.45 + (playerLevel * 0.02);
      let dx = aimDirX * (currentWeapon === "BAZOKA" ? 0.22 : speedScale);
      let dz = aimDirZ * (currentWeapon === "BAZOKA" ? 0.22 : speedScale);

      const bGeo = new THREE.SphereGeometry(currentWeapon === "BAZOKA" ? 0.5 : 0.25, 8, 8);
      const bMat = new THREE.MeshBasicMaterial({ color: currentWeapon === "BAZOKA" ? 0xf97316 : 0xfacc15 });
      const mesh = new THREE.Mesh(bGeo, bMat);
      mesh.position.set(playerMesh.position.x, 0.6, playerMesh.position.z);
      scene.add(mesh);

      bullets.push({ mesh: mesh, dx: dx, dz: dz, type: currentWeapon });

      if (gameMode === 'coop' && roomRef) {
        roomRef.child('bullets').push({
          x: playerMesh.position.x,
          z: playerMesh.position.z,
          dx: dx,
          dz: dz,
          type: currentWeapon,
          owner: playerRole
        });
      }
    }

    function triggerAdminSwordSlash() {
      const SWORD_SLASH_RADIUS = 6.0;

      const ringGeo = new THREE.RingGeometry(0.2, 0.8, 32);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xfbcfe8, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.rotation.x = Math.PI / 2;
      ringMesh.position.set(playerMesh.position.x, 0.4, playerMesh.position.z);
      scene.add(ringMesh);

      let scale = 1;
      const ringInterval = setInterval(() => {
        scale += 1.2;
        ringMesh.scale.set(scale, scale, scale);
        ringMat.opacity -= 0.15;
        if (ringMat.opacity <= 0) {
          clearInterval(ringInterval);
          scene.remove(ringMesh);
        }
      }, 20);

      for (let i = bots.length - 1; i >= 0; i--) {
        let bot = bots[i];
        let distance = playerMesh.position.distanceTo(bot.mesh.position);

        if (distance <= SWORD_SLASH_RADIUS) {
          spawnHealOrb(bot.mesh.position.x, bot.mesh.position.z);
          if (gameMode === 'solo') {
            scene.remove(bot.mesh);
            bots.splice(i, 1);
          } else if (playerRole === 'p1' && roomRef) {
            roomRef.child(`bots/${bot.key}`).remove();
          }
          kills++;
          checkPlayerLevel();
          const killsEl = document.getElementById("kills");
          if (killsEl) killsEl.innerText = kills;
          if (gameMode === 'coop' && roomRef) roomRef.update({ kills: kills });
          syncRealtimeScore();
        }
      }
    }

    function spawnRemoteBullet(b) {
      const bGeo = new THREE.SphereGeometry(b.type === "BAZOKA" ? 0.5 : 0.25, 8, 8);
      const bMat = new THREE.MeshBasicMaterial({ color: 0x22c55e });
      const mesh = new THREE.Mesh(bGeo, bMat);
      mesh.position.set(b.x, 0.6, b.z);
      scene.add(mesh);

      bullets.push({ mesh: mesh, dx: b.dx, dz: b.dz, type: b.type });
    }

    function triggerExplosionAOE(epicenter) {
      const AOE_RADIUS = 15.0;

      const expGeo = new THREE.SphereGeometry(AOE_RADIUS, 16, 16);
      const expMat = new THREE.MeshBasicMaterial({ color: 0xff4500, transparent: true, opacity: 0.6 });
      const expMesh = new THREE.Mesh(expGeo, expMat);
      expMesh.position.copy(epicenter);
      scene.add(expMesh);

      let scale = 0.2;
      const expInterval = setInterval(() => {
        scale += 0.2;
        expMesh.scale.set(scale, scale, scale);
        expMat.opacity -= 0.1;
        if (expMat.opacity <= 0) {
          clearInterval(expInterval);
          scene.remove(expMesh);
        }
      }, 30);

      for (let i = bots.length - 1; i >= 0; i--) {
        let bot = bots[i];
        spawnHealOrb(bot.mesh.position.x, bot.mesh.position.z);
        if (gameMode === 'solo') {
          scene.remove(bot.mesh);
          bots.splice(i, 1);
        } else if (playerRole === 'p1' && roomRef) {
          roomRef.child(`bots/${bot.key}`).remove();
        }
        kills++;
        checkPlayerLevel();
        const killsEl = document.getElementById("kills");
        if (killsEl) killsEl.innerText = kills;
        if (gameMode === 'coop' && roomRef) roomRef.update({ kills: kills });
        syncRealtimeScore();
      }
    }

    function updateGameLogic() {
      if (!isPlaying) return;

      let moveX = moveJoyDir.x;
      let moveZ = moveJoyDir.y;

      if (keys['ArrowUp'] || keys['w']) moveZ = -1;
      if (keys['ArrowDown'] || keys['s']) moveZ = 1;
      if (keys['ArrowLeft'] || keys['a']) moveX = -1;
      if (keys['ArrowRight'] || keys['d']) moveX = 1;

      if (moveX !== 0 || moveZ !== 0) {
        playerMesh.position.x += moveX * playerMoveSpeed;
        playerMesh.position.z += moveZ * playerMoveSpeed;

        if (Math.abs(attackJoyDir.x) < 0.2 && Math.abs(attackJoyDir.y) < 0.2) {
          let angle = Math.atan2(moveX, moveZ);
          playerMesh.rotation.y = angle + Math.PI;
        }

        if (gameMode === 'coop' && roomRef) {
          roomRef.child(playerRole).update({
            x: playerMesh.position.x,
            z: playerMesh.position.z
          });
        }
      }

      let attackMagnitude = Math.hypot(attackJoyDir.x, attackJoyDir.y);
      if (attackMagnitude > 0.3) {
        let normX = attackJoyDir.x / attackMagnitude;
        let normZ = attackJoyDir.y / attackMagnitude;

        let angle = Math.atan2(normX, normZ);
        playerMesh.rotation.y = angle + Math.PI;

        executeAttack(normX, normZ);
      }

      const limit = (ARENA_SIZE / 2) - 1;
      playerMesh.position.x = Math.max(-limit, Math.min(limit, playerMesh.position.x));
      playerMesh.position.z = Math.max(-limit, Math.min(limit, playerMesh.position.z));

      for (let hIdx = healItems.length - 1; hIdx >= 0; hIdx--) {
        let item = healItems[hIdx];
        let dist = playerMesh.position.distanceTo(item.position);
        if (dist < 1.0) {
          if (!isGodMode) {
            playerHP = Math.min(100, playerHP + 15);
            const hpEl = document.getElementById("hp");
            if (hpEl) hpEl.innerText = playerHP;
          }
          scene.remove(item);
          healItems.splice(hIdx, 1);
        }
      }

      for (let index = bullets.length - 1; index >= 0; index--) {
        let b = bullets[index];
        b.mesh.position.x += b.dx;
        b.mesh.position.z += b.dz;

        let hitHappened = false;

        for (let bIdx = bots.length - 1; bIdx >= 0; bIdx--) {
          let bot = bots[bIdx];
          let dist = b.mesh.position.distanceTo(bot.mesh.position);

          if (dist < 0.9) {
            hitHappened = true;
            if (b.type === "BAZOKA") {
              triggerExplosionAOE(b.mesh.position.clone());
            } else {
              spawnHealOrb(bot.mesh.position.x, bot.mesh.position.z);
              if (gameMode === 'solo') {
                scene.remove(bot.mesh);
                bots.splice(bIdx, 1);
              } else if (playerRole === 'p1' && roomRef) {
                roomRef.child(`bots/${bot.key}`).remove();
              }
              kills++;
              checkPlayerLevel();
              const killsEl = document.getElementById("kills");
              if (killsEl) killsEl.innerText = kills;
              if (gameMode === 'coop' && roomRef) roomRef.update({ kills: kills });
              syncRealtimeScore();
            }
            break;
          }
        }

        if (hitHappened || Math.abs(b.mesh.position.x) > limit || Math.abs(b.mesh.position.z) > limit) {
          if (!hitHappened && b.type === "BAZOKA") {
            triggerExplosionAOE(b.mesh.position.clone());
          }
          scene.remove(b.mesh);
          bullets.splice(index, 1);
        }
      }

      const now = Date.now();
      bots.forEach((bot) => {
        let distP1 = bot.mesh.position.distanceTo(playerMesh.position);
        let distP2 = (gameMode === 'coop') ? bot.mesh.position.distanceTo(otherPlayerMesh.position) : 999;
        let target = distP1 < distP2 ? playerMesh.position : otherPlayerMesh.position;

        let dx = target.x - bot.mesh.position.x;
        let dz = target.z - bot.mesh.position.z;
        let angle = Math.atan2(dx, dz);

        bot.mesh.position.x += Math.sin(angle) * bot.speed;
        bot.mesh.position.z += Math.cos(angle) * bot.speed;
        bot.mesh.rotation.y = angle;

        if (distP1 < 0.8 && now - lastHitTime > 800) {
          lastHitTime = now;
          if (!isGodMode) {
            playerHP -= botBaseDamage;
            if (playerHP < 0) playerHP = 0;
            const hpEl = document.getElementById("hp");
            if (hpEl) hpEl.innerText = playerHP;
          }

          if (playerHP <= 0 && isPlaying) {
            if (gameMode === 'solo') {
              triggerLocalGameOver();
            } else {
              triggerGlobalGameOver();
            }
          }
        }
      });
    }

    function triggerGlobalGameOver() {
      if (roomRef) roomRef.update({ status: 'gameover' });
    }

    function triggerLocalGameOver() {
      isPlaying = false;
      clearInterval(botSpawner);

      syncRealtimeScore();

      showMainMenu();
      overlay.style.display = "flex";
      document.getElementById("owner-modal").style.display = "none";
    }

    function animate() {
      requestAnimationFrame(animate);
      updateGameLogic();
      renderer.render(scene, camera);
    }

    init3D();
  </script>
</body>
</html>
