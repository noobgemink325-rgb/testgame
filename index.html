<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Bot War Arena - Smooth Touch Fix</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #090d16;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 10px 0;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 2px;
      color: #ef4444;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .score-board {
      font-size: 14px;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    #game-container {
      position: relative;
      border: 3px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.2);
    }
    canvas {
      background: #0f172a;
      display: block;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 20px;
    }
    input[type="text"] {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      font-size: 15px;
      text-align: center;
      margin-bottom: 12px;
      width: 80%;
      outline: none;
    }
    #start-btn {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: #ef4444;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }
    #start-btn:active {
      transform: scale(0.95);
    }

    /* Area Kontrol HP */
    .controls-wrapper {
      width: 340px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      padding: 0 10px;
    }
    #joystick-container {
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      position: relative;
      touch-action: none;
    }
    #joystick-stick {
      width: 40px;
      height: 40px;
      background: #38bdf8;
      border-radius: 50%;
      position: absolute;
      top: 30px;
      left: 30px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
      pointer-events: none;
    }
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-shoot {
      width: 100px;
      height: 55px;
      background: #dc2626;
      border: 2px solid #ef4444;
      color: white;
      font-weight: bold;
      font-size: 15px;
      border-radius: 12px;
      touch-action: manipulation;
      box-shadow: 0 4px 10px rgba(220, 38, 38, 0.4);
    }
    .btn-shoot:active {
      background: #991b1b;
      transform: scale(0.95);
    }
    .toggle-auto {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 6px;
      font-size: 11px;
      border-radius: 6px;
      text-align: center;
    }

    /* Leaderboard Box */
    .leaderboard-box {
      width: 340px;
      margin-top: 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
    }
    .leaderboard-title {
      font-size: 13px;
      color: #facc15;
      font-weight: bold;
      text-align: center;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    ol {
      padding-left: 20px;
      font-size: 12px;
      color: #cbd5e1;
    }
    li {
      margin-bottom: 2px;
    }
    .no-data {
      color: #64748b;
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>WAR ARENA vs BOTS 🔫</h1>
  <div class="score-board">Kill: <span id="kills" style="color:#22c55e; font-weight:bold;">0</span> | HP: <span id="hp" style="color:#ef4444; font-weight:bold;">100</span></div>

  <div id="game-container">
    <canvas id="canvas" width="340" height="300"></canvas>
    
    <div id="overlay">
      <h2 id="msg-title" style="margin-bottom: 10px; color: #ef4444;">BATTLE ARENA</h2>
      <input type="text" id="player-name" placeholder="Masukkan Nickname Kamu..." maxlength="12">
      <button id="start-btn" onclick="startGame()">MULAI PERANG 💣</button>
    </div>
  </div>

  <!-- Area Control (Multi-Touch Smooth) -->
  <div class="controls-wrapper">
    <div id="joystick-container">
      <div id="joystick-stick"></div>
    </div>

    <div class="action-group">
      <button class="btn-shoot" id="shoot-btn">TEMBAK 💥</button>
      <button id="auto-btn" class="toggle-auto" onclick="toggleAutoShoot()">Auto Shoot: OFF</button>
    </div>
  </div>

  <div class="leaderboard-box">
    <div class="leaderboard-title">🏆 LEADERBOARD TOP KILL</div>
    <ol id="leaderboard-list">
      <p class="no-data">Belum ada skor tercatat.</p>
    </ol>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const killsEl = document.getElementById("kills");
    const hpEl = document.getElementById("hp");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("start-btn");
    const msgTitle = document.getElementById("msg-title");
    const autoBtn = document.getElementById("auto-btn");
    const playerNameInput = document.getElementById("player-name");
    const leaderboardList = document.getElementById("leaderboard-list");
    const shootBtn = document.getElementById("shoot-btn");

    let player, bullets, botBullets, bots, kills, isPlaying, gameLoopId, botSpawner, autoShootInterval;
    let keys = {};
    let lastMoveDir = { x: 0, y: -1 };
    let joystickDir = { x: 0, y: 0 };
    let autoShoot = false;
    let playerName = "Player";

    // LEADERBOARD
    function loadLeaderboard() {
      const scores = JSON.parse(localStorage.getItem("war_leaderboard") || "[]");
      leaderboardList.innerHTML = "";
      if (scores.length === 0) {
        leaderboardList.innerHTML = `<p class="no-data">Belum ada skor tercatat.</p>`;
        return;
      }
      scores.forEach((item) => {
        const li = document.createElement("li");
        li.innerHTML = `<b>${item.name}</b>: <span style="color:#22c55e">${item.kills} Kill</span>`;
        leaderboardList.appendChild(li);
      });
    }

    function saveScore(name, killCount) {
      if(killCount === 0) return;
      let scores = JSON.parse(localStorage.getItem("war_leaderboard") || "[]");
      scores.push({ name: name, kills: killCount });
      scores.sort((a, b) => b.kills - a.kills);
      scores = scores.slice(0, 5);
      localStorage.setItem("war_leaderboard", JSON.stringify(scores));
      loadLeaderboard();
    }

    // --- MULTI-TOUCH JOYSTICK LOGIC (SANTUY & MANDIRI) ---
    const joyContainer = document.getElementById("joystick-container");
    const joyStick = document.getElementById("joystick-stick");
    const maxRadius = 30;
    let joystickTouchId = null;

    function processJoyMove(clientX, clientY) {
      const rect = joyContainer.getBoundingClientRect();
      let dx = clientX - (rect.left + rect.width / 2);
      let dy = clientY - (rect.top + rect.height / 2);
      let distance = Math.hypot(dx, dy);

      if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
      }

      joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
      joystickDir.x = dx / maxRadius;
      joystickDir.y = dy / maxRadius;

      if (Math.abs(joystickDir.x) > 0.05 || Math.abs(joystickDir.y) > 0.05) {
        lastMoveDir = { x: joystickDir.x, y: joystickDir.y };
      }
    }

    function resetJoy() {
      joystickTouchId = null;
      joyStick.style.transform = "translate(0px, 0px)";
      joystickDir = { x: 0, y: 0 };
    }

    // Touch Event Handlers
    window.addEventListener("touchstart", (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        let touch = e.changedTouches[i];
        const rect = joyContainer.getBoundingClientRect();
        
        // Cek jika sentuhan ada di dalam area joystick
        if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
            touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
          if (joystickTouchId === null) {
            joystickTouchId = touch.identifier;
            processJoyMove(touch.clientX, touch.clientY);
          }
        }
      }
    }, { passive: false });

    window.addEventListener("touchmove", (e) => {
      if (joystickTouchId !== null) {
        for (let i = 0; i < e.changedTouches.length; i++) {
          let touch = e.changedTouches[i];
          if (touch.identifier === joystickTouchId) {
            processJoyMove(touch.clientX, touch.clientY);
          }
        }
      }
    }, { passive: false });

    window.addEventListener("touchend", (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joystickTouchId) {
          resetJoy();
        }
      }
    });

    window.addEventListener("touchcancel", (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joystickTouchId) {
          resetJoy();
        }
      }
    });

    // Support Mouse Drag (Desktop)
    let isMouseDown = false;
    joyContainer.addEventListener("mousedown", (e) => {
      isMouseDown = true;
      processJoyMove(e.clientX, e.clientY);
    });
    window.addEventListener("mousemove", (e) => {
      if (isMouseDown) processJoyMove(e.clientX, e.clientY);
    });
    window.addEventListener("mouseup", () => {
      if (isMouseDown) {
        isMouseDown = false;
        resetJoy();
      }
    });

    // Tombol Tembak Handler (Touch + Click)
    shootBtn.addEventListener("touchstart", (e) => {
      e.preventDefault(); // Biar gak ganggu touch joystick
      if (isPlaying) playerShoot();
    });
    shootBtn.addEventListener("mousedown", () => {
      if (isPlaying) playerShoot();
    });

    // KEYBOARD CONTROLS
    window.addEventListener("keydown", (e) => {
      keys[e.key] = true;
      if (e.code === "Space" && isPlaying) playerShoot();
    });
    window.addEventListener("keyup", (e) => keys[e.key] = false);

    function toggleAutoShoot() {
      autoShoot = !autoShoot;
      autoBtn.innerText = autoShoot ? "Auto Shoot: ON 🔥" : "Auto Shoot: OFF";
      autoBtn.style.background = autoShoot ? "#16a34a" : "#334155";

      if (autoShoot) {
        autoShootInterval = setInterval(() => { if (isPlaying) playerShoot(); }, 250);
      } else {
        clearInterval(autoShootInterval);
      }
    }

    function startGame() {
      playerName = playerNameInput.value.trim() || "User";
      player = { x: 170, y: 150, radius: 12, hp: 100, speed: 3 };
      bullets = [];
      botBullets = [];
      bots = [];
      kills = 0;
      isPlaying = true;
      
      killsEl.innerText = kills;
      hpEl.innerText = player.hp;
      overlay.style.display = "none";

      if (botSpawner) clearInterval(botSpawner);
      botSpawner = setInterval(spawnBot, 1800);

      if (gameLoopId) cancelAnimationFrame(gameLoopId);
      update();
    }

    function spawnBot() {
      if (!isPlaying) return;
      let x = Math.random() < 0.5 ? 0 : canvas.width;
      let y = Math.random() * canvas.height;

      bots.push({ x: x, y: y, radius: 10, speed: 1.2, lastShoot: Date.now() });
    }

    function playerShoot() {
      if (!isPlaying) return;
      let mag = Math.hypot(lastMoveDir.x, lastMoveDir.y) || 1;
      bullets.push({
        x: player.x,
        y: player.y,
        dx: (lastMoveDir.x / mag) * 6,
        dy: (lastMoveDir.y / mag) * 6,
        radius: 4
      });
    }

    function update() {
      if (!isPlaying) return;

      let moveX = joystickDir.x;
      let moveY = joystickDir.y;

      if (keys['ArrowUp'] || keys['w']) moveY = -1;
      if (keys['ArrowDown'] || keys['s']) moveY = 1;
      if (keys['ArrowLeft'] || keys['a']) moveX = -1;
      if (keys['ArrowRight'] || keys['d']) moveX = 1;

      if (moveX !== 0 || moveY !== 0) {
        player.x += moveX * player.speed;
        player.y += moveY * player.speed;
      }

      player.x = Math.max(12, Math.min(canvas.width - 12, player.x));
      player.y = Math.max(12, Math.min(canvas.height - 12, player.y));

      bullets.forEach((b, index) => {
        b.x += b.dx;
        b.y += b.dy;
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(index, 1);
      });

      bots.forEach((bot, bIndex) => {
        let angle = Math.atan2(player.y - bot.y, player.x - bot.x);
        bot.x += Math.cos(angle) * bot.speed;
        bot.y += Math.sin(angle) * bot.speed;

        if (Date.now() - bot.lastShoot > 1500) {
          botBullets.push({
            x: bot.x, y: bot.y,
            dx: Math.cos(angle) * 3.5, dy: Math.sin(angle) * 3.5,
            radius: 3
          });
          bot.lastShoot = Date.now();
        }

        bullets.forEach((b, pIndex) => {
          let dist = Math.hypot(b.x - bot.x, b.y - bot.y);
          if (dist < b.radius + bot.radius) {
            bots.splice(bIndex, 1);
            bullets.splice(pIndex, 1);
            kills++;
            killsEl.innerText = kills;
          }
        });
      });

      botBullets.forEach((bb, index) => {
        bb.x += bb.dx;
        bb.y += bb.dy;

        let dist = Math.hypot(bb.x - player.x, bb.y - player.y);
        if (dist < bb.radius + player.radius) {
          player.hp -= 10;
          hpEl.innerText = player.hp;
          botBullets.splice(index, 1);

          if (player.hp <= 0) gameOver();
        }

        if (bb.x < 0 || bb.x > canvas.width || bb.y < 0 || bb.y > canvas.height) botBullets.splice(index, 1);
      });

      draw();
      gameLoopId = requestAnimationFrame(update);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      let mag = Math.hypot(lastMoveDir.x, lastMoveDir.y) || 1;
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(player.x, player.y);
      ctx.lineTo(player.x + (lastMoveDir.x / mag) * 18, player.y + (lastMoveDir.y / mag) * 18);
      ctx.stroke();

      ctx.fillStyle = "#facc15";
      bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill(); });

      ctx.fillStyle = "#ef4444";
      bots.forEach(bot => { ctx.beginPath(); ctx.arc(bot.x, bot.y, bot.radius, 0, Math.PI * 2); ctx.fill(); });

      ctx.fillStyle = "#fb923c";
      botBullets.forEach(bb => { ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.radius, 0, Math.PI * 2); ctx.fill(); });
    }

    function gameOver() {
      isPlaying = false;
      clearInterval(botSpawner);
      if (autoShootInterval) clearInterval(autoShootInterval);
      
      saveScore(playerName, kills);
      
      msgTitle.innerText = "KAMU GUGUR!";
      startBtn.innerText = "MAIN LAGI 🔄";
      overlay.style.display = "flex";
    }

    loadLeaderboard();
  </script>
</body>
</html>
